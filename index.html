<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Setti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* ── Organic design-system tokens (from _ds/organic .../styles.css) ── */
  :root {
    --color-bg: #f5ead8;
    --color-surface: #ebddc5;
    --color-text: #201e1d;
    --color-divider: color-mix(in srgb, #201e1d 16%, transparent);

    --color-neutral-100: #f9f4ed;
    --color-neutral-200: #eee7db;
    --color-neutral-300: #dcd3c4;
    --color-neutral-400: #c0b6a5;
    --color-neutral-500: #a19786;
    --color-neutral-600: #82796a;
    --color-neutral-700: #645c50;
    --color-neutral-800: #474238;
    --color-neutral-900: #2e2b25;

    --font-heading: "Barlow Condensed", system-ui, sans-serif;
    --font-body: "Figtree", system-ui, sans-serif;

    --radius-sm: 8px;
    --radius-md: 16px;
    --radius-lg: 28px;

    --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);
    --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);
    --shadow-lg: 0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);
  }

  /* Accent seed ramps live on <body> so palette classes (also on <body>) and
     the numbered mapping below resolve against the SAME element — a var() in a
     :root-declared property would resolve the seed on :root, ignoring the swap. */
  body {
    --a1:#fff2eb; --a2:#ffe1d0; --a3:#ffc6a5; --a4:#f6a06b; --a5:#d67f48; --a6:#b2622d; --a7:#8c491a; --a8:#643312; --a9:#402310; --a-base:#c67139;
    --b1:#f0fae1; --b2:#e1eecc; --b3:#ccdbb2; --b4:#aebf92; --b5:#8fa073; --b6:#728157; --b7:#56633f; --b8:#3d472b; --b9:#272e1b; --b-base:#7a8a5e;

    --color-accent: var(--a-base);
    --color-accent-2: var(--b-base);
    --color-accent-100: var(--a1); --color-accent-200: var(--a2); --color-accent-300: var(--a3); --color-accent-400: var(--a4); --color-accent-500: var(--a5); --color-accent-600: var(--a6); --color-accent-700: var(--a7); --color-accent-800: var(--a8); --color-accent-900: var(--a9);
    --color-accent-2-100: var(--b1); --color-accent-2-200: var(--b2); --color-accent-2-300: var(--b3); --color-accent-2-400: var(--b4); --color-accent-2-500: var(--b5); --color-accent-2-600: var(--b6); --color-accent-2-700: var(--b7); --color-accent-2-800: var(--b8); --color-accent-2-900: var(--b9);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* every heading uses var(--font-heading) inline — force it heavy */
  [style*="--font-heading"] { font-weight: 700; }
  html, body { margin: 0; }
  body {
    font-family: var(--font-body);
    color: var(--color-text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background:
      radial-gradient(120% 80% at 50% -10%, #efe7d8, #e6d8bf 70%),
      #e6d8bf;
  }
  a { color: var(--color-accent); }
  a:hover { color: var(--color-accent-700); }
  .sx::-webkit-scrollbar { display: none; }
  .sx { scrollbar-width: none; }

  /* ── phone frame ── */
  .phone {
    width: 402px;
    height: 874px;
    max-height: calc(100vh - 48px);
    border-radius: 48px;
    overflow: hidden;
    position: relative;
    background: var(--color-bg);
    box-shadow: 0 40px 80px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.12);
    -webkit-font-smoothing: antialiased;
  }
  .island {
    position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
    width: 126px; height: 37px; border-radius: 24px; background: #000; z-index: 50;
  }
  .statusbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 40;
    display: flex; align-items: center; justify-content: space-between;
    padding: 19px 30px 0; pointer-events: none;
  }
  .statusbar .time {
    font-family: -apple-system, "SF Pro", system-ui; font-weight: 600;
    font-size: 15px; color: var(--color-text);
  }
  .homebar {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 60;
    height: 30px; display: flex; justify-content: center; align-items: flex-end;
    padding-bottom: 8px; pointer-events: none;
  }
  .homebar > div {
    width: 139px; height: 5px; border-radius: 100px;
    background: color-mix(in srgb, var(--color-text) 30%, transparent);
  }
  button { font-family: inherit; }

  /* ── accent palettes — each swaps the seed ramps only ── */
  body.pal-forest {
    --a1:#eef6e6; --a2:#d7ecc6; --a3:#b6dc9c; --a4:#8fc56d; --a5:#6bac48; --a6:#528d34; --a7:#3f6c28; --a8:#2b4a1d; --a9:#1c3113; --a-base:#5a9440;
    /* teal secondary — cool, no orange */
    --b1:#e3f4f1; --b2:#c2e7e0; --b3:#93d3c8; --b4:#5cb8aa; --b5:#329888; --b6:#217a6d; --b7:#1a5d53; --b8:#14413a; --b9:#0d2b26; --b-base:#329888;
  }
  body.pal-ocean {
    --a1:#e7f1f8; --a2:#c6e1ef; --a3:#95c8e2; --a4:#5ba9cf; --a5:#3089b6; --a6:#206d97; --a7:#195374; --a8:#143c51; --a9:#0e2836; --a-base:#2f88b4;
    /* plum secondary — cool, no orange */
    --b1:#f3ecf6; --b2:#e3d3ea; --b3:#ccb0d9; --b4:#ad86c1; --b5:#8f63a6; --b6:#734b88; --b7:#583a68; --b8:#3d2848; --b9:#281a2f; --b-base:#8f63a6;
  }
  body.pal-graphite {
    --a1:#f1efec; --a2:#ddd9d2; --a3:#c2bcb0; --a4:#a0978a; --a5:#7f7566; --a6:#615849; --a7:#473f34; --a8:#2f2a22; --a9:#1c1813; --a-base:#6f6557;
    --b1:#eef1f4; --b2:#d7dee6; --b3:#b6c2d0; --b4:#8ea0b4; --b5:#6a7d94; --b6:#516375; --b7:#3d4b59; --b8:#2a333d; --b9:#1a2027; --b-base:#6a7d94;
  }

  /* ── dark theme: bg/surface/text flip, tonal ramps invert so every
     "accent-200 bg + accent-800 text" pair stays readable on dark ── */
  body.dark {
    --color-bg: #1b1815;
    --color-surface: #262019;
    --color-text: #f2e9da;
    --color-divider: color-mix(in srgb, #f2e9da 15%, transparent);

    --color-neutral-100: #2e2b25;
    --color-neutral-200: #474238;
    --color-neutral-300: #645c50;
    --color-neutral-400: #82796a;
    --color-neutral-500: #a19786;
    --color-neutral-600: #c0b6a5;
    --color-neutral-700: #dcd3c4;
    --color-neutral-800: #eee7db;
    --color-neutral-900: #f9f4ed;

    /* invert the seed ramp step-for-step, works for any palette */
    --color-accent-100: var(--a9); --color-accent-200: var(--a8); --color-accent-300: var(--a7); --color-accent-400: var(--a6); --color-accent-500: var(--a5); --color-accent-600: var(--a4); --color-accent-700: var(--a3); --color-accent-800: var(--a2); --color-accent-900: var(--a1);
    --color-accent-2-100: var(--b9); --color-accent-2-200: var(--b8); --color-accent-2-300: var(--b7); --color-accent-2-400: var(--b6); --color-accent-2-500: var(--b5); --color-accent-2-600: var(--b4); --color-accent-2-700: var(--b3); --color-accent-2-800: var(--b2); --color-accent-2-900: var(--b1);

    --shadow-sm: 0 1px 2px rgba(0,0,0,.5);
    --shadow-md: 0 3px 12px rgba(0,0,0,.55);
    --shadow-lg: 0 14px 34px rgba(0,0,0,.6);
    background: #14110f;
  }
  body.dark .phone { box-shadow: 0 40px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.06); }

  @media (max-width: 640px) {
    html, body { height: 100%; }
    body { padding: 0; background: var(--color-bg); display: block; }
    .phone {
      width: 100vw; height: 100vh; height: 100dvh; max-height: none;
      border-radius: 0; box-shadow: none;
    }
    .island { display: none; }
  }
  /* "at the gym" live pulse for friend avatars */
  @keyframes livePulse {
    0%   { box-shadow: 0 0 0 0 rgba(34,175,90,.55); }
    70%  { box-shadow: 0 0 0 8px rgba(34,175,90,0); }
    100% { box-shadow: 0 0 0 0 rgba(34,175,90,0); }
  }
  .live-ring { animation: livePulse 1.8s ease-out infinite; }
  .live-dot  { animation: livePulse 1.8s ease-out infinite; }
  /* week-strip completion stamp: solid check drops into the holster on finish */
  @keyframes stampIn {
    0%   { opacity: 0; transform: translateY(-10px) scale(1.9); }
    26%  { opacity: 1; transform: translateY(0) scale(.84); }   /* impact squash */
    42%  { transform: scale(1.1); }
    62%  { transform: scale(.97); }
    100% { opacity: 1; transform: scale(1); }
  }
</style>
</head>

/* ══════════════════════════════════════════════════════════════
   Tiny DOM helper — h(tag, props, ...children).
   Supports style object, event handlers, and style-hover / -active.
   ══════════════════════════════════════════════════════════════ */
function h(tag, props, ...kids){
  const el = document.createElement(tag);
  props = props || {};
  let base = null, hover = null, active = null;
  for (const k in props){
    const val = props[k];
    if (val == null || val === false) continue;
    if (k === 'style'){ Object.assign(el.style, val); base = {...val}; }
    else if (k === 'hover') hover = val;
    else if (k === 'active') active = val;
    else if (k === 'html') el.innerHTML = val;
    else if (k === 'class') el.className = val;
    else if (k === 'draggable') el.draggable = val;
    else if (k.slice(0,2) === 'on' && typeof val === 'function'){
      el.addEventListener(k.slice(2).toLowerCase(), val);
    }
    else el.setAttribute(k, val);
  }
  const applyBase = () => base && Object.assign(el.style, base);
  if (hover){
    el.addEventListener('mouseenter', () => Object.assign(el.style, hover));
    el.addEventListener('mouseleave', applyBase);
  }
  if (active){
    el.addEventListener('mousedown', () => Object.assign(el.style, active));
    const up = () => Object.assign(el.style, hover || base || {});
    el.addEventListener('mouseup', up);
    el.addEventListener('mouseleave', applyBase);
  }
  for (const c of kids.flat()){
    if (c == null || c === false) continue;
    el.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return el;
}
// convenience
const svgNS = 'http://www.w3.org/2000/svg';
function svg(attrs, inner){
  const el = document.createElementNS(svgNS, 'svg');
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  el.innerHTML = inner;
  return el;
}

// A day gets a random sticker + ink. Re-rolled fresh each page load (STICKER_SALT) but cached per day so it
// stays put across the session's re-renders. Constraint: the same icon never repeats within a 4-day span.
const STICKER_SALT = (Math.random() * 0xffffffff) >>> 0;
const STICKER_EPOCH = Date.UTC(2020, 0, 1);   // fixed anchor; day index counts up from here
const _stickerCache = {};                       // dayIndex -> STK_KEYS index (fills lazily, persists this session)
function _dayIndex(dateStr){ const p = dateStr.split('-'); return Math.round((Date.UTC(+p[0], +p[1]-1, +p[2]) - STICKER_EPOCH) / 86400000); }
function _stickerRand(n){ let t = (n + STICKER_SALT) >>> 0; t = Math.imul(t ^ (t>>>15), t|1); t ^= t + Math.imul(t ^ (t>>>7), t|61); return ((t ^ (t>>>14)) >>> 0) / 4294967296; }
function _stickerIndex(n){
  if (n in _stickerCache) return _stickerCache[n];
  for (let i = Math.max(0, n-500); i <= n; i++){        // build sequentially so the no-repeat window is defined
    if (i in _stickerCache) continue;
    let idx = Math.floor(_stickerRand(i) * STK_KEYS.length);
    const avoid = [_stickerCache[i-1], _stickerCache[i-2], _stickerCache[i-3]];
    let guard = 0;
    while (avoid.indexOf(idx) !== -1 && guard++ < STK_KEYS.length) idx = (idx + 1) % STK_KEYS.length;
    _stickerCache[i] = idx;
  }
  return _stickerCache[n];
}

  const dash = opt.dashed ? ' stroke-dasharray="5 5"' : '';
  const hl = opt.solid ? '<ellipse cx="26" cy="30" rx="8" ry="4.5" fill="#ffd6e4" stroke="none" transform="rotate(-24 26 30)"/>' : '';
  return svg({viewBox:'0 0 100 96', width:size, height:size, style:'overflow:visible;display:block'},
    '<g fill="'+fill+'" stroke="'+line+'" stroke-width="'+lw+'" stroke-linejoin="round" stroke-linecap="round"'+dash+'>'
    + '<path d="M45 52 C39 64 30 78 23 93 L32 88 L37 96 L48 56 Z"/>'          // left tail
    + '<path d="M55 52 C61 64 70 78 77 93 L68 88 L63 96 L52 56 Z"/>'          // right tail
    + '<path d="M45 34 C26 16 8 20 7 33 C6 43 6 47 8 57 C11 70 28 64 45 50 Z"/>'   // left loop
    + '<path d="M55 34 C74 16 92 20 93 33 C94 43 94 47 92 57 C89 70 72 64 55 50 Z"/>' // right loop
    + hl
    + '<path fill="none" d="M43 39 C36 38 31 40 28 41"/>'   // creases (ribbon folding into knot)
    + '<path fill="none" d="M43 47 C36 48 31 47 28 46"/>'
    + '<path fill="none" d="M57 39 C64 38 69 40 72 41"/>'
    + '<path fill="none" d="M57 47 C64 48 69 47 72 46"/>'

// Press-and-drag reorder: hold a grip and drag the slot up/down. Live-shifts the
// other cards to open a gap, commits with moveEx on release. Pointer events cover
// mouse + touch; the grip sets touch-action:none so a vertical drag doesn't scroll.
function startExDrag(e, from){
  if (e.button != null && e.button !== 0) return;      // left button / primary touch only
  const card = e.currentTarget.closest('[data-slot]');
  if (!card) return;
  e.preventDefault();
  const container = card.parentNode;
  const cards = Array.from(container.querySelectorAll('[data-slot]'));
  const n = cards.length;
  const step = card.getBoundingClientRect().height + 8;  // card height + 8px marginBottom
  const startY = e.clientY;
  let to = from;
  scrubbing = true;                                      // freeze rest re-render while dragging
  card.style.transition = 'box-shadow .12s, transform .04s';
  card.style.zIndex = '20';
  card.style.position = 'relative';
  card.style.boxShadow = '0 12px 26px rgba(0,0,0,.24)';
  card.style.transform = 'scale(1.025)';
  const shiftCards = () => cards.forEach((c, idx) => {
    if (idx === from) return;
    let s = 0;
    if (from < to && idx > from && idx <= to) s = -step;
    else if (from > to && idx < from && idx >= to) s = step;
    c.style.transition = 'transform .16s';
    c.style.transform = s ? 'translateY(' + s + 'px)' : 'none';
  });
  const onMove = (ev) => {
    const dy = ev.clientY - startY;
    card.style.transform = 'translateY(' + dy + 'px) scale(1.025)';
    let t = Math.max(0, Math.min(n - 1, from + Math.round(dy / step)));
    if (t !== to){ to = t; shiftCards(); }
  };
  const onUp = () => {
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    scrubbing = false;
    if (to === from){ setState({}); return; }            // no move → repaint to clear inline styles
    moveEx(from, to);
  };
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}

const fmtNum = v => (+v).toString();
let scrubbing = false, activeSpin = null;
// Number that becomes a continuous spin-wheel: click to open, drag the strip of digits
// (tracks the finger 1:1, depth fade, eased snap), click anywhere else to confirm.
// opts:{value,label,min,max,step,onPick,size:'big'|'mini'}
function spinField(opts){
  const big = opts.size !== 'mini';
  const itemH = big ? 40 : 26, visible = 3, H = itemH*visible;
  const snap = v => +( Math.round(v/opts.step)*opts.step ).toFixed(2);
  const fade = 'linear-gradient(180deg, transparent, #000 30%, #000 70%, transparent)';

  const numEl = h('div', {style:{position:'absolute',inset:'0',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'var(--font-heading)',fontSize:big?'48px':'22px',lineHeight:'1',letterSpacing:'-.03em',transition:'color .12s,transform .12s'}}, fmtNum(opts.value));
  const box = h('div', {style:{position:'relative',height:H+'px',overflow:'hidden',webkitMaskImage:fade,maskImage:fade}}, numEl);
  const unitEl = h('div', {style:{fontSize:big?'11px':'9px',letterSpacing:'.14em',textTransform:'uppercase',color:'var(--color-neutral-600)',fontWeight:'700',marginTop:'2px',textAlign:'center',transition:'color .12s'}}, opts.label);
  const wrap = h('div', {style:{position:'relative',flex:big?'1':'none',minWidth:big?'':'72px',borderRadius:'16px',userSelect:'none',webkitUserSelect:'none',touchAction:'none',cursor:'ns-resize',transition:'background .14s'}}, box, unitEl);

  let vals = [], items = [], strip = null, sel = 0, restT = 0, minT = 0, maxT = 0;

  const paint = (t, anim) => {
    t = Math.max(minT, Math.min(maxT, t));
    curT = t;
    strip.style.transition = anim ? 'transform .28s cubic-bezier(.22,1,.36,1)' : 'none';
    strip.style.transform = 'translateY(' + t + 'px)';
    sel = Math.max(0, Math.min(vals.length-1, Math.round((H/2 - t)/itemH - 0.5)));
    for (let j = 0; j < items.length; j++){
      const near = Math.abs((t + (j+0.5)*itemH) - H/2) / itemH;   // 0 at centre
      const el = items[j];
      el.style.opacity = String(Math.max(0.16, 1 - near*0.42));
      el.style.transform = 'scale(' + Math.max(0.62, 1 - near*0.14) + ')';
      el.style.color = near < 0.5 ? 'var(--color-accent-800)' : 'var(--color-text)';
    }
  };
  const open = () => {
    if (active) return;
    if (activeSpin && activeSpin !== close) activeSpin(true);   // confirm+close any other open wheel
    active = true; scrubbing = true; activeSpin = close;
    if (navigator.vibrate) navigator.vibrate(6);
    wrap.style.background = 'var(--color-accent-100)';
    unitEl.style.color = 'var(--color-accent-700)';
    const base = opts.value, R = 40; vals = [];
    for (let k = -R; k <= R; k++){ const v = snap(base + k*opts.step); if (v < opts.min || v > opts.max) continue; vals.push(v); }
    const baseIdx = Math.max(0, vals.indexOf(snap(base)));
    items = vals.map(v => h('div', {style:{height:itemH+'px',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'var(--font-heading)',fontSize:big?'40px':'22px',lineHeight:'1',letterSpacing:'-.03em',willChange:'transform,opacity'}}, fmtNum(v)));
    strip = h('div', {style:{position:'absolute',left:'0',right:'0',top:'0'}}, ...items);
    numEl.style.display = 'none';
    box.append(strip);
    restT = H/2 - (baseIdx + 0.5)*itemH;
    maxT  = H/2 - 0.5*itemH;
    minT  = H/2 - (vals.length - 0.5)*itemH;
    paint(restT, false);
    // click anywhere outside this wheel → confirm & close (registered next frame so the opening click is ignored)
    setTimeout(() => { docHandler = ev => { if (!wrap.contains(ev.target)) close(true); }; document.addEventListener('pointerdown', docHandler, true); }, 0);
  };
  const close = commit => {
    if (!active) return;
    active = false; dragging = false; scrubbing = false; activeSpin = null;
    if (docHandler){ document.removeEventListener('pointerdown', docHandler, true); docHandler = null; }
    const v = vals[sel];
    (commit && v !== opts.value) ? opts.onPick(v) : render();
  };
  wrap.addEventListener('pointerdown', e => {
    if (!active) open();
    dragging = true; moved = false; startY = e.clientY; startT = curT;
    try { wrap.setPointerCapture(e.pointerId); } catch(_){}
  });

    if (!dragging) return;
    if (Math.abs(e.clientY - startY) > 3) moved = true;
    paint(startT + (e.clientY - startY), false);      // 1:1 finger tracking
  });
  wrap.addEventListener('pointerup', () => {
    if (!dragging) return;
    dragging = false;
    if (moved) paint(H/2 - (sel + 0.5)*itemH, true);   // eased snap to nearest; stays open
  });
  wrap.addEventListener('pointercancel', () => { dragging = false; });
  wrap.addEventListener('contextmenu', e => e.preventDefault());
  return wrap;
}

    hist[day.name] = (hist[day.name] || []).concat(mins);
    const sets = [];
    w.queue.forEach(q => q.done.forEach(x => sets.push({id:q.id, g:EX[q.id].g, kg:x.kg, reps:x.reps})));
    if (sets.length){
      const vol = sets.reduce((a,x) => a + x.kg*x.reps, 0);
      const today = ymd(new Date());
      log = [...(S.log||[]), {date:today, name:day.name, sets, vol, mins, photo:w.photo || null}];
      slapDay = today;
    }
  }
  setState({hist, log, overlay:null, w:null, tab:'today', slapDay});
}

      ),

function viewProgress(){
  // consistency — one-month calendar (weekday letters + day numbers, done days filled)
  const now = new Date();
  const y = now.getFullYear(), mo = now.getMonth(), todayN = now.getDate();
  const monthName = now.toLocaleString('en-US', {month:'long'});
  const daysIn = new Date(y, mo+1, 0).getDate();
  const offset = (new Date(y, mo, 1).getDay() + 6) % 7;   // Monday-first
  const dow = ['M','T','W','T','F','S','S'];
  const dowHead = h('div', {style:{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:'6px',marginTop:'16px',marginBottom:'8px'}},
    dow.map(l => h('div', {style:{textAlign:'center',fontSize:'10px',letterSpacing:'.08em',textTransform:'uppercase',color:'var(--color-neutral-600)',fontWeight:'700'}}, l))
  );
  const doneDays = new Set((S.log||[]).map(r => parseYmd(r.date)).filter(dt => dt.getFullYear()===y && dt.getMonth()===mo).map(dt => dt.getDate()));
  const cells = [];
  for (let i = 0; i < offset; i++) cells.push(h('div', {}));
  for (let d = 1; d <= daysIn; d++){
    const wd = (new Date(y, mo, d).getDay() + 6) % 7;                 // Monday-first weekday index
    const isRest = S.week[wd] && S.week[wd].ex.length === 0;          // planned rest → darker, no sticker
    const done = doneDays.has(d) && !isRest;
    const isToday = d === todayN;
    const dateStr = ymd(new Date(y, mo, d));
    cells.push(h('div', {style:{position:'relative',aspectRatio:'1',borderRadius:'8px',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'12px',fontWeight:'700',fontVariantNumeric:'tabular-nums',cursor:done?'pointer':'default',
      background: done ? 'var(--color-accent-2-600)' : isRest ? 'color-mix(in srgb, var(--color-neutral-900) 22%, var(--color-neutral-200))' : 'var(--color-neutral-200)',
      color: done ? 'var(--color-bg)' : isRest ? 'var(--color-neutral-600)' : 'var(--color-neutral-700)',
      border: '2px solid ' + (isToday ? 'var(--color-accent)' : 'transparent')}, onClick:done?((ev) => setState({dayDetail:dateStr, dayFrom:{x:ev.clientX, y:ev.clientY}})):null},
      String(d),
      done ? doneMark(18, {position:'absolute',top:'-7px',right:'-7px',border:'2px solid var(--color-bg)',zIndex:'2'}) : null));
  }
  const monthGrid = h('div', {style:{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:'6px'}}, ...cells);
  const consistency = h('div', {style:{background:'var(--color-surface)',borderRadius:'var(--radius-md)',padding:'18px',marginBottom:'14px',boxShadow:'var(--shadow-sm)'}},
    h('div', {style:{display:'flex',alignItems:'baseline',justifyContent:'space-between'}},
      h('div', {style:{fontFamily:'var(--font-heading)',fontSize:'18px'}}, 'Consistency'),
      h('div', {style:{fontSize:'12px',color:'var(--color-neutral-600)'}}, monthName + ' ' + y)
    ),
    dowHead,
    monthGrid
  );

  // Most improved — biggest est. 1RM gain (earliest → latest session) per exercise from the log.
  const e1rm = x => Math.round(x.kg * (1 + x.reps/30));
  const byEx = {};
  (S.log||[]).forEach(r => {
    const best = {};
    r.sets.forEach(x => { const v = e1rm(x); if (best[x.id] == null || v > best[x.id]) best[x.id] = v; });
    Object.keys(best).forEach(id => (byEx[id] = byEx[id] || []).push({date:r.date, v:best[id]}));
  });
  let improved = Object.keys(byEx).map(id => {
    const a = byEx[id].slice().sort((p,q) => parseYmd(p.date) - parseYmd(q.date));
    return {id, from:a[0].v, to:a[a.length-1].v, delta:a[a.length-1].v - a[0].v, n:a.length};
  }).filter(o => o.n >= 2 && o.delta > 0);
  if (!improved.length){   // demo fallback from the seeded series
    improved = ['bench','squat','ohp','row'].map(id => { const s = SERIES[id] || SERIES.bench; return {id, from:s[0], to:s[s.length-1], delta:s[s.length-1]-s[0], n:s.length}; })
      .filter(o => o.delta > 0);
  }
  improved.sort((a,b) => b.delta - a.delta);
  const top3 = improved.slice(0,3);
  const medal = ['var(--color-accent-2-600)','var(--color-neutral-500)','var(--color-accent-400)'];
  const chartCard = h('div', {style:{background:'var(--color-surface)',borderRadius:'var(--radius-md)',padding:'18px',marginBottom:'14px',boxShadow:'var(--shadow-sm)'}},
    h('div', {style:{display:'flex',alignItems:'baseline',justifyContent:'space-between',marginBottom:'14px'}},
      h('div', {style:{fontFamily:'var(--font-heading)',fontSize:'18px'}}, 'Most improved'),
      h('div', {style:{fontSize:'12px',color:'var(--color-neutral-600)'}}, 'Est. 1RM')
    ),
    top3.length ? top3.map((o,i) => h('div', {style:{display:'flex',alignItems:'center',gap:'12px',padding:'10px 0',borderBottom:(i<top3.length-1?'1px solid var(--color-divider)':'none')}},
      h('div', {style:{width:'26px',height:'26px',flex:'none',borderRadius:'999px',background:medal[i],color:'var(--color-bg)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'12px',fontWeight:'700'}}, i+1),
      h('div', {style:{flex:'1',minWidth:'0'}},
        h('div', {style:{fontSize:'15px',fontWeight:'600',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}, EX[o.id] ? EX[o.id].n : o.id),
        h('div', {style:{fontSize:'11px',color:'var(--color-neutral-600)',marginTop:'2px'}}, o.from + ' → ' + o.to + ' kg')
      ),
      h('div', {style:{flex:'none',fontFamily:'var(--font-heading)',fontSize:'19px',color:'var(--color-accent-700)'}}, '+' + o.delta + ' kg')
    )) : h('div', {style:{fontSize:'14px',color:'var(--color-neutral-600)',padding:'6px 0'}}, 'Log a couple of sessions to see your gains.')
  );

  // muscle balance — real logged sets over the last 30 days (falls back to plan estimate if nothing logged yet)
  const setsBy = {}; GROUPS.forEach(g => setsBy[g] = 0);
  const cutoff = new Date(); cutoff.setHours(0,0,0,0); cutoff.setDate(cutoff.getDate()-30);
  let logged = 0;
  (S.log||[]).forEach(r => { if (parseYmd(r.date) >= cutoff) r.sets.forEach(s => { if (s.g in setsBy){ setsBy[s.g]++; logged++; } }); });
  if (!logged) S.week.forEach(d => d.ex.forEach(id => setsBy[EX[id].g] += EX[id].sets * 4));
  const balSub = logged ? 'Last 30 days' : 'Last month';
  const top = Math.max(1, ...Object.values(setsBy));
  const balCard = h('div', {style:{background:'var(--color-surface)',borderRadius:'var(--radius-md)',padding:'18px',boxShadow:'var(--shadow-sm)'}},
    h('div', {style:{display:'flex',alignItems:'baseline',justifyContent:'space-between',marginBottom:'14px'}},
      h('div', {style:{fontFamily:'var(--font-heading)',fontSize:'18px'}}, 'Muscle balance'),
      h('div', {style:{fontSize:'12px',color:'var(--color-neutral-600)'}}, balSub)
    ),
    GROUPS.map(g => {
      const ratio = setsBy[g]/top;
      return h('div', {style:{marginBottom:'12px'}},
        h('div', {style:{display:'flex',justifyContent:'space-between',fontSize:'12px',fontWeight:'600',marginBottom:'5px'}},
          h('span', {}, g), h('span', {style:{color:'var(--color-neutral-600)'}}, setsBy[g] + ' sets')),
        h('div', {style:{height:'9px',borderRadius:'999px',background:'var(--color-neutral-300)',overflow:'hidden'}},
          h('div', {style:{height:'100%',borderRadius:'999px',background:(ratio>0.55?'var(--color-accent-2-600)':'var(--color-accent-400)'),width:Math.round(ratio*100)+'%'}}))
      );
    })
  );

  return h('div', {style:{padding:'6px 22px 152px'}},
    h('h2', {style:{fontFamily:'var(--font-heading)',fontSize:'30px',margin:'0 0 16px'}}, 'Progress'),
    consistency, chartCard, balCard
  );
}

/* ── overlay: workout ── */
function viewWorkout(){
  const w = S.w;

  const elapsed = Math.floor((Date.now() - w.start)/1000);
  const wClock = Math.floor(elapsed/60) + ':' + String(elapsed%60).padStart(2,'0') + ' elapsed';

  const dots = h('div', {style:{display:'flex',gap:'4px',padding:'12px 22px 0'}},

    body = h('div', {style:{flex:'1',display:'flex',flexDirection:'column',padding:'26px 22px 34px'}},

      h('div', {style:{display:'flex',gap:'10px',marginBottom:'16px'}},

          h('div', {style:{fontSize:'10px',letterSpacing:'.08em',textTransform:'uppercase',fontWeight:'700',color:'var(--color-accent-700)',marginTop:'5px'}}, uLbl + ' volume')),

          h('div', {style:{fontSize:'10px',letterSpacing:'.08em',textTransform:'uppercase',fontWeight:'700',color:'var(--color-accent-2-700)',marginTop:'5px'}}, 'Sets')),
        h('div', {style:{flex:'1',background:'var(--color-neutral-200)',borderRadius:'var(--radius-md)',padding:'15px'}},
          h('div', {style:{fontFamily:'var(--font-heading)',fontSize:'26px',lineHeight:'1'}}, Math.floor(elapsed/60) + 'm'),
          h('div', {style:{fontSize:'10px',letterSpacing:'.08em',textTransform:'uppercase',fontWeight:'700',color:'var(--color-neutral-700)',marginTop:'5px'}}, 'Duration'))
      ),
      h('div', {class:'sx', style:{flex:'1',overflowY:'auto',background:'var(--color-surface)',borderRadius:'var(--radius-md)',padding:'14px 16px'}}, ...summary),
      // Attach a photo — opens the in-app camera; shows in your day-detail and the friends feed.
      w.photo
        ? h('div', {style:{position:'relative',marginTop:'14px'}},
            h('img', {src:w.photo, style:{display:'block',width:'100%',height:'auto',borderRadius:'var(--radius-md)'}}),

    const ex = EX[w.queue[w.ei].id];
    const ring = svg({viewBox:'0 0 120 120', style:'width:100%;height:100%;transform:rotate(-90deg)'},
      '<circle cx="60" cy="60" r="54" fill="none" stroke="var(--color-neutral-300)" stroke-width="9"></circle>'+

    );
    body = h('div', {style:{flex:'1',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'22px 22px 40px',gap:'6px'}},
      h('div', {style:{fontSize:'11px',letterSpacing:'.14em',textTransform:'uppercase',color:'var(--color-accent-2-700)',fontWeight:'700'}}, 'Rest'),
      h('div', {style:{position:'relative',width:'230px',height:'230px',margin:'10px 0 6px'}},

        h('div', {style:{position:'absolute',inset:'0',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}},

    body = h('div', {style:{flex:'1',display:'flex',flexDirection:'column',padding:'26px 22px 30px'}},

// Read a picked image file, downscale to ≤256px, hand back a JPEG data URL.
function readPhoto(file, cb){
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 1080, scale = Math.min(1, max/Math.max(img.width, img.height));
      const w = Math.round(img.width*scale), hgt = Math.round(img.height*scale);
      const c = document.createElement('canvas'); c.width = w; c.height = hgt;
      const cx = c.getContext('2d'); cx.imageSmoothingQuality = 'high'; cx.drawImage(img, 0, 0, w, hgt);
      cb(c.toDataURL('image/jpeg', 0.85));
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
}
// Native camera/file picker fallback (no live-camera API, or on permission failure).
function pickPhotoFallback(){
  const inp = h('input', {type:'file', accept:'image/*', capture:'environment', style:{display:'none'},
    onChange:(e) => { const f = e.target.files && e.target.files[0]; if (f) readPhoto(f, url => setState({w:{...S.w, photo:url}})); if (inp.parentNode) document.body.removeChild(inp); }});
  document.body.appendChild(inp); inp.click();
}
// In-app camera: live preview + flash (torch), zoom, shutter, retake/use. Lives outside render().
function openCamera(){
  const md = navigator.mediaDevices;
  if (!md || !md.getUserMedia){ pickPhotoFallback(); return; }
  let stream = null, track = null, hwZoom = false, zoom = 1, facing = 'user';   // open to selfie mode

  const video = h('video', {autoplay:'', playsinline:'', style:{position:'absolute',inset:'0',width:'100%',height:'100%',objectFit:'cover',transformOrigin:'center center'}});
  video.muted = true; video.playsInline = true;
  // 3:4 (portrait "4:3") frame — the visible + captured area.
  const frame = h('div', {style:{position:'absolute',left:'0',right:'0',top:'50%',transform:'translateY(-50%)',aspectRatio:'3 / 4',overflow:'hidden',background:'#000'}}, video);
  const flashPop = h('div', {style:{position:'absolute',inset:'0',background:'#fff',opacity:'0',pointerEvents:'none',transition:'opacity .18s'}});

  const iconBtn = (glyph, extra) => h('button', {style:Object.assign({width:'44px',height:'44px',flex:'none',borderRadius:'999px',border:'none',background:'rgba(255,255,255,.16)',color:'#fff',cursor:'pointer',fontSize:'18px',display:'flex',alignItems:'center',justifyContent:'center'}, extra||{})}, glyph);
  const closeBtn = iconBtn('✕');
  const flipBtn = iconBtn('⟳');
  const flashBtn = iconBtn('⚡');
  const topBar = h('div', {style:{position:'absolute',top:'0',left:'0',right:'0',display:'flex',justifyContent:'space-between',padding:'46px 20px 0',zIndex:'2'}}, closeBtn, h('div', {style:{display:'flex',gap:'12px'}}, flipBtn, flashBtn));

  // Zoom preset buttons (0.5× / 1× / 2×).
  const zoomLevels = [0.5, 1, 2];
  const zoomBtns = zoomLevels.map(z => h('button', {style:{minWidth:'46px',height:'34px',borderRadius:'999px',border:'none',cursor:'pointer',fontFamily:'var(--font-heading)',fontSize:'13px',background:'rgba(255,255,255,.18)',color:'#fff',padding:'0 12px'}}, (z===1?'1':String(z))+'×'));
  const zoomRow = h('div', {style:{display:'flex',gap:'10px'}}, ...zoomBtns);
  const shutter = h('button', {style:{width:'74px',height:'74px',flex:'none',borderRadius:'999px',border:'5px solid #fff',background:'rgba(255,255,255,.35)',cursor:'pointer'}});
  const bottomBar = h('div', {style:{position:'absolute',bottom:'0',left:'0',right:'0',display:'flex',flexDirection:'column',alignItems:'center',gap:'18px',padding:'0 20px 42px',zIndex:'2'}}, zoomRow, shutter);

  const overlay = h('div', {style:{position:'fixed',inset:'0',background:'#000',zIndex:'300'}}, frame, flashPop, topBar, bottomBar);
  document.body.appendChild(overlay);

  const effZoom = () => Math.max(1, zoom);   // digital zoom can't go below 1
  const applyView = () => {   // combine zoom + selfie mirror on the preview
    const mx = facing === 'user' ? -1 : 1;
    if (hwZoom){ try { track.applyConstraints({advanced:[{zoom:Math.max((track.getCapabilities&&track.getCapabilities().zoom?track.getCapabilities().zoom.min:1), Math.min((track.getCapabilities&&track.getCapabilities().zoom?track.getCapabilities().zoom.max:zoom), zoom))}]}); } catch(_){} video.style.transform = 'scaleX('+mx+')'; }
    else video.style.transform = 'scale('+(mx*effZoom())+','+effZoom()+')';
    zoomBtns.forEach((b,i) => { const on = zoomLevels[i] === zoom; b.style.background = on ? '#fff' : 'rgba(255,255,255,.18)'; b.style.color = on ? '#000' : '#fff'; });
  };
  zoomBtns.forEach((b,i) => b.addEventListener('click', () => { zoom = zoomLevels[i]; applyView(); }));

  let torchOn = false;
  flashBtn.addEventListener('click', () => { if (!track) return; torchOn = !torchOn; try { track.applyConstraints({advanced:[{torch:torchOn}]}); } catch(_){} flashBtn.style.background = torchOn ? '#fff' : 'rgba(255,255,255,.16)'; flashBtn.style.color = torchOn ? '#000' : '#fff'; });

  const cleanup = () => { if (stream) stream.getTracks().forEach(t => t.stop()); if (overlay.parentNode) document.body.removeChild(overlay); };
  closeBtn.addEventListener('click', cleanup);

  const capture = () => {
    if (!video.videoWidth) return;
    const vw = video.videoWidth, vh = video.videoHeight, targ = 3/4;   // portrait 3:4
    // largest 3:4 rect that fits the sensor
    let bw, bh; if (vw/vh > targ){ bh = vh; bw = vh*targ; } else { bw = vw; bh = vw/targ; }
    const eff = hwZoom ? 1 : effZoom();                                 // extra digital zoom (crop)
    const sw = bw/eff, sh = bh/eff, sx = (vw-sw)/2, sy = (vh-sh)/2;
    const scale = Math.min(1, 1080/sh), cw = Math.round(sw*scale), ch = Math.round(sh*scale);
    const c = document.createElement('canvas'); c.width = cw; c.height = ch;
    const cx = c.getContext('2d'); cx.imageSmoothingQuality = 'high';
    if (facing === 'user'){ cx.translate(cw, 0); cx.scale(-1, 1); }   // match the mirrored selfie preview
    cx.drawImage(video, sx, sy, sw, sh, 0, 0, cw, ch);
    const url = c.toDataURL('image/jpeg', 0.85);
    flashPop.style.opacity = '0.9'; setTimeout(() => { flashPop.style.opacity = '0'; }, 180);
    showPreview(url);
  };
  shutter.addEventListener('click', capture);

  function showPreview(url){
    const img = h('img', {src:url, style:{position:'absolute',inset:'0',width:'100%',height:'100%',objectFit:'contain',background:'#000',zIndex:'3'}});
    const btn = (label, primary) => h('button', {style:{flex:'1',border:primary?'none':'1px solid rgba(255,255,255,.5)',background:primary?'#fff':'transparent',color:primary?'#000':'#fff',cursor:'pointer',borderRadius:'999px',padding:'15px',fontFamily:'var(--font-heading)',fontSize:'16px'}}, label);
    const retake = btn('↺ Retake', false), use = btn('Use photo', true);
    const pbar = h('div', {style:{position:'absolute',bottom:'0',left:'0',right:'0',display:'flex',gap:'12px',padding:'0 20px 42px',zIndex:'4'}}, retake, use);
    video.style.display = 'none'; topBar.style.display = 'none'; bottomBar.style.display = 'none';
    overlay.appendChild(img); overlay.appendChild(pbar);
    retake.addEventListener('click', () => { overlay.removeChild(img); overlay.removeChild(pbar); video.style.display = ''; topBar.style.display = ''; bottomBar.style.display = ''; });
    use.addEventListener('click', () => { cleanup(); setState({w:{...S.w, photo:url}}); });
  }

  function startStream(firstTime){
    if (stream) stream.getTracks().forEach(t => t.stop());
    hwZoom = false; zoom = 1;
    md.getUserMedia({video:{facingMode:{ideal:facing}, width:{ideal:1920}, height:{ideal:1080}}, audio:false})
      .then(s => {
        stream = s; video.srcObject = s; track = s.getVideoTracks()[0];
        const caps = track.getCapabilities ? track.getCapabilities() : {};
        if (caps.zoom) hwZoom = true;
        flashBtn.style.display = caps.torch ? '' : 'none';   // torch only on the back camera usually
        applyView();
      })
      .catch(() => { if (firstTime){ cleanup(); pickPhotoFallback(); } });
  }
  flipBtn.addEventListener('click', () => { facing = facing === 'user' ? 'environment' : 'user'; startStream(false); });
  startStream(true);
}

  const panel = h('div', {class:'sx', style:{width:'100%',maxHeight:'86%',overflowY:'auto',background:'var(--color-bg)',borderTopLeftRadius:'var(--radius-lg)',borderTopRightRadius:'var(--radius-lg)',padding:'14px 22px 34px'},
      onClick:(ev) => ev.stopPropagation()},
    h('div', {style:{width:'44px',height:'5px',borderRadius:'999px',background:'var(--color-neutral-400)',margin:'0 auto 18px'}}),
    h('div', {style:{fontFamily:'var(--font-heading)',fontSize:'24px',marginBottom:'20px'}}, 'Edit profile'),

    // Photo — editable anytime.
    h('div', {style:{display:'flex',alignItems:'center',gap:'16px',marginBottom:'24px'}},
      selfAvatar(72),
      h('div', {style:{flex:'1',display:'flex',flexDirection:'column',gap:'8px'}},
        h('button', {style:{border:'none',cursor:'pointer',background:'var(--color-accent)',color:'var(--color-bg)',borderRadius:'999px',padding:'10px 14px',fontFamily:'var(--font-heading)',fontSize:'13px'}, hover:{background:'var(--color-accent-600)'}, onClick:() => fileInput.click()}, S.pfp ? 'Change photo' : 'Upload photo'),
        S.pfp ? h('button', {style:{border:'1px solid var(--color-divider)',cursor:'pointer',background:'transparent',color:'var(--color-text)',borderRadius:'999px',padding:'10px 14px',fontFamily:'var(--font-heading)',fontSize:'13px'}, hover:{background:'color-mix(in srgb, var(--color-text) 7%, transparent)'}, onClick:() => setState({pfp:null})}, 'Remove photo') : null
      ),
      fileInput
    ),

    // Username — once a week.
    h('div', {style:{fontSize:'11px',letterSpacing:'.1em',textTransform:'uppercase',fontWeight:'700',color:'var(--color-neutral-700)',marginBottom:'8px'}}, 'Username'),
    nameInput,
    h('div', {style:{fontSize:'12px',color:(locked?'var(--color-accent-700)':'var(--color-neutral-600)'),marginTop:'8px'}},
      locked ? 'You can change your username again in ' + daysLeft + ' day' + (daysLeft>1?'s':'') + '.' : 'You can change your username once a week.'),

    h('button', {style:{width:'100%',marginTop:'24px',border:'none',cursor:'pointer',background:'var(--color-accent)',color:'var(--color-bg)',borderRadius:'999px',padding:'16px',fontFamily:'var(--font-heading)',fontSize:'16px'}, hover:{background:'var(--color-accent-600)'}, onClick:save}, 'Save'),
    h('button', {style:{width:'100%',marginTop:'8px',border:'none',cursor:'pointer',background:'transparent',color:'var(--color-neutral-600)',borderRadius:'999px',padding:'12px',fontFamily:'var(--font-heading)',fontSize:'14px'}, onClick:() => setState({editProfile:false})}, 'Cancel')
  );
  return h('div', {style:{position:'absolute',inset:'0',background:'rgba(32,30,29,.45)',display:'flex',alignItems:'flex-end',zIndex:'85'},
      onClick:() => setState({editProfile:false})}, panel);
}

// Main tab order (matches the tab bar). Drives the swipe pager.
const TAB_ORDER = ['progress','plans','today','friends','settings'];
function viewFor(tab){
  return tab === 'plans' ? viewPlans() : tab === 'friends' ? viewFriends() : tab === 'progress' ? viewProgress() : tab === 'settings' ? viewSettings() : viewToday();
}
const _scrollByTab = {};   // remember each tab's vertical scroll across re-renders

// Snapchat-style pager: three panels (prev · current · next) on a flex track offset to
// show the middle. A horizontal drag moves the track with the finger; release snaps to a
// neighbour (then commits the tab) or springs back. Vertical drags fall through to scroll.
function buildPager(){
  const ci = Math.max(0, TAB_ORDER.indexOf(S.tab));
  const prevTab = ci > 0 ? TAB_ORDER[ci-1] : null;
  const nextTab = ci < TAB_ORDER.length-1 ? TAB_ORDER[ci+1] : null;
  const panel = (tab) => h('div', {class:'sx', style:{flex:'0 0 100%',height:'100%',overflowY:'auto',overflowX:'hidden'}}, tab ? viewFor(tab) : null);
  const pPrev = panel(prevTab), pCur = panel(S.tab), pNext = panel(nextTab);
  const track = h('div', {style:{display:'flex',height:'100%',transform:'translateX(-100%)',willChange:'transform'}}, pPrev, pCur, pNext);
  const viewport = h('div', {style:{flex:'1',position:'relative',overflow:'hidden',touchAction:'pan-y'}}, track);

  // restore scroll positions
  [[prevTab,pPrev],[S.tab,pCur],[nextTab,pNext]].forEach(([t,p]) => { if (t) p.scrollTop = _scrollByTab[t] || 0; });
  pCur.addEventListener('scroll', () => { _scrollByTab[S.tab] = pCur.scrollTop; });
  phone._scroll = pCur;

  let sx = 0, sy = 0, axis = null, down = false, w = 0, committing = false;
  viewport.addEventListener('pointerdown', (e) => {
    if (committing || S.overlay || S.sheet || S.dayDetail || S.friendProfile) return;
    // let an inner horizontal scroller (friend strip, chips) keep the gesture
    for (let n = e.target; n && n !== viewport; n = n.parentElement){
      if (n !== pPrev && n !== pCur && n !== pNext && n.scrollWidth > n.clientWidth + 4 && /auto|scroll/.test(getComputedStyle(n).overflowX)) return;
    }
    down = true; axis = null; sx = e.clientX; sy = e.clientY; w = viewport.clientWidth || 1;
    track.style.transition = 'none';
  });
  viewport.addEventListener('pointermove', (e) => {
    if (!down) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (axis === null){
      if (Math.abs(dx) > 7 || Math.abs(dy) > 7){ axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y'; if (axis === 'x'){ try { viewport.setPointerCapture(e.pointerId); } catch(_){} } }
    }
    if (axis !== 'x') return;
    e.preventDefault();
    let d = dx;
    if ((d > 0 && !prevTab) || (d < 0 && !nextTab)) d *= 0.28;   // rubber-band at the ends
    track.style.transform = 'translateX(calc(-100% + ' + d + 'px))';
  });
  const finish = (e) => {
    if (!down) return; down = false;
    if (axis !== 'x') return;
    const dx = e.clientX - sx;
    const thr = Math.min(85, w * 0.26);
    let target = null, to = '-100%';
    if (dx <= -thr && nextTab){ target = nextTab; to = '-200%'; }
    else if (dx >= thr && prevTab){ target = prevTab; to = '0%'; }
    track.style.transition = 'transform .26s cubic-bezier(.22,.61,.36,1)';
    track.style.transform = 'translateX(' + to + ')';
    if (target){ committing = true; setTimeout(() => { setState({tab:target, overlay:null}); if (target === 'friends') loadSocial(); }, 250); }
  };
  viewport.addEventListener('pointerup', finish);
  viewport.addEventListener('pointercancel', () => { if (down){ down = false; track.style.transition = 'transform .2s'; track.style.transform = 'translateX(-100%)'; } });
  return viewport;
}

/* ── chrome: header, tab bar ── */
function statusBar(){
  return h('div', {class:'statusbar'},
    h('span', {class:'time'}, '9:41'),
    h('div', {style:{display:'flex',alignItems:'center',gap:'6px'}},

      svg({width:'16',height:'12',viewBox:'0 0 17 12'},
        '<path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill="currentColor"/><path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill="currentColor"/><circle cx="8.5" cy="10.5" r="1.5" fill="currentColor"/>'),
      svg({width:'25',height:'12',viewBox:'0 0 27 13'},

    )

}
function header(){
  return h('div', {style:{padding:'calc(env(safe-area-inset-top) + 16px) 22px 4px'}});
}
const TAB_ICONS = {
  today: '<rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><circle cx="12" cy="15" r="1.5" fill="currentColor" stroke="none"/>',

  friends: '<circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c0-3.3 2.5-5.5 5.5-5.5s5.5 2.2 5.5 5.5"/><path d="M16 5.2a3.2 3.2 0 0 1 0 6.1"/><path d="M17.5 14.7c2 .7 3.5 2.6 3.5 5.3"/>',
  settings: '<circle cx="12" cy="12" r="3.4"/><path d="M12 3v2.4M12 18.6V21M4.4 4.4l1.7 1.7M17.9 17.9l1.7 1.7M3 12h2.4M18.6 12H21M4.4 19.6l1.7-1.7M17.9 6.1l1.7-1.7"/>'
};
function tabIcon(id){
  return svg({width:'23',height:'23',viewBox:'0 0 24 24',fill:'none',stroke:'currentColor','stroke-width':'2','stroke-linecap':'round','stroke-linejoin':'round'}, TAB_ICONS[id]);
}
function tabBar(){
  const tabs = [['progress','Progress'],['plans','Split'],['today','Today'],['friends','Friends'],['settings','Settings']];
  return h('div', {style:{position:'absolute',left:'0',right:'0',bottom:'0',paddingBottom:'calc(env(safe-area-inset-bottom) + 12px)',background:'var(--color-bg)',borderTop:'1px solid var(--color-divider)',display:'flex',zIndex:'30'}},
    tabs.map(([id,name]) => {
      const on = S.tab === id;
      return h('button', {style:{flex:'1',cursor:'pointer',border:'none',background:'transparent',color:(on?'var(--color-accent)':'var(--color-neutral-600)'),padding:'10px 0 0',display:'flex',flexDirection:'column',alignItems:'center',gap:'4px',fontFamily:'var(--font-body)',fontSize:'11px',fontWeight:'700',letterSpacing:'.02em'}, onClick:() => { setState({tab:id, overlay:null}); if (id === 'friends') loadSocial(); }},
        tabIcon(id),
        h('span', {}, name),
        h('div', {style:{width:'26px',height:'3px',borderRadius:'999px',marginTop:'2px',background:(on?'var(--color-accent)':'transparent')}})
      );
    })
  );
}

/* ══════════════════════════════════════════════════════════════
   Render
   ══════════════════════════════════════════════════════════════ */
const phone = document.getElementById('phone');
function render(){
  const pager = buildPager();

  const app = h('div', {style:{height:'100%',display:'flex',flexDirection:'column',background:'var(--color-bg)',fontFamily:'var(--font-body)',color:'var(--color-text)',position:'relative',overflow:'hidden'}},
    header(),
    pager,
    tabBar(),
    S.overlay === 'builder' && viewBuilder(),
    S.overlay === 'workout' && viewWorkout(),
    S.overlay === 'plans' && viewPlanPicker(),
    viewSheet(),
    viewDayDetail(),
    viewFriendProfile(),
    viewFriendPlan(),
    viewInviteCompose(),
    viewEditProfile()
  );

  phone.innerHTML = '';
  phone.append(app);

  // The tapped day grows fast and "jumps" into the middle of the screen, blooming into the card.
  if (S.dayDetail && S.dayFrom){
    const sheet = document.getElementById('daySheet'), backdrop = document.getElementById('daySheetBackdrop');
    if (sheet){
      const r = sheet.getBoundingClientRect();
      const cx = r.left + r.width/2, cy = r.top + r.height/2;   // card centre (screen)
      const dx = S.dayFrom.x - cx, dy = S.dayFrom.y - cy;       // offset from centre to tapped icon
      sheet.animate([
        {transform:'translate('+dx+'px,'+dy+'px) scale(.12)', opacity:0,   offset:0},
        {transform:'translate('+(dx*0.12)+'px,'+(dy*0.12)+'px) scale(1.08)', opacity:1, offset:0.75},
        {transform:'translate(0,0) scale(1)', opacity:1, offset:1}
      ], {duration:420, easing:'cubic-bezier(.34,1.4,.5,1)'});
      if (backdrop) backdrop.animate([{opacity:0},{opacity:1}], {duration:200, easing:'ease-out'});
    }
    S.dayFrom = null;   // don't replay on later re-renders while the card stays open
  }

  // Just-finished workout: the check stamps into that day's holster (drops in big → smacks → settles).
  if (S.slapDay){
    const el = document.getElementById('strip-sticker-'+S.slapDay);
    if (el){
      el.animate([
        {transform:'translateY(-10px) scale(1.9)', opacity:0, offset:0},
        {transform:'translateY(0) scale(.84)',     opacity:1, offset:.30},   // impact squash
        {transform:'scale(1.1)', offset:.5},
        {transform:'scale(.97)', offset:.7},
        {transform:'scale(1)',   offset:1}
      ], {duration:520, easing:'cubic-bezier(.3,1.2,.5,1)'});
    }
    S.slapDay = null;
  }
}

// Rest timer / elapsed clock tick. During REST, repaint for the countdown ring; during
// active logging, only patch the elapsed-clock text so constant re-renders don't eat taps.
setInterval(() => {
  const w = S.w; if (!w || scrubbing) return;
  if (w.resting){ render(); return; }
  if (!w.done){ const el = document.getElementById('wClock'); if (el){ const e = Math.floor((Date.now() - w.start)/1000); el.textContent = Math.floor(e/60) + ':' + String(e%60).padStart(2,'0') + ' elapsed'; } }
}, 250);

applyPrefs();
render();
</script>
