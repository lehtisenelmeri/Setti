<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />

<title>Setti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* ── Organic design-system tokens (from _ds/organic .../styles.css) ── */
  :root {
    --color-bg: #f5ead8;
    --color-surface: #ebddc5;
    --color-text: #201e1d;
    --color-divider: color-mix(in srgb, #201e1d 16%, transparent);

    --color-neutral-100: #f9f4ed;
    --color-neutral-200: #eee7db;
    --color-neutral-300: #dcd3c4;
    --color-neutral-400: #c0b6a5;
    --color-neutral-500: #a19786;
    --color-neutral-600: #82796a;
    --color-neutral-700: #645c50;
    --color-neutral-800: #474238;
    --color-neutral-900: #2e2b25;

    --font-heading: "Barlow Condensed", system-ui, sans-serif;
    --font-body: "Figtree", system-ui, sans-serif;

    --radius-sm: 8px;
    --radius-md: 16px;
    --radius-lg: 28px;

    --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);
    --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);
    --shadow-lg: 0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);
  }

  /* Accent seed ramps live on <body> so palette classes (also on <body>) and
     the numbered mapping below resolve against the SAME element — a var() in a
     :root-declared property would resolve the seed on :root, ignoring the swap. */
  body {
    --a1:#fff2eb; --a2:#ffe1d0; --a3:#ffc6a5; --a4:#f6a06b; --a5:#d67f48; --a6:#b2622d; --a7:#8c491a; --a8:#643312; --a9:#402310; --a-base:#c67139;
    --b1:#f0fae1; --b2:#e1eecc; --b3:#ccdbb2; --b4:#aebf92; --b5:#8fa073; --b6:#728157; --b7:#56633f; --b8:#3d472b; --b9:#272e1b; --b-base:#7a8a5e;

    --color-accent: var(--a-base);
    --color-accent-2: var(--b-base);
    --color-accent-100: var(--a1); --color-accent-200: var(--a2); --color-accent-300: var(--a3); --color-accent-400: var(--a4); --color-accent-500: var(--a5); --color-accent-600: var(--a6); --color-accent-700: var(--a7); --color-accent-800: var(--a8); --color-accent-900: var(--a9);
    --color-accent-2-100: var(--b1); --color-accent-2-200: var(--b2); --color-accent-2-300: var(--b3); --color-accent-2-400: var(--b4); --color-accent-2-500: var(--b5); --color-accent-2-600: var(--b6); --color-accent-2-700: var(--b7); --color-accent-2-800: var(--b8); --color-accent-2-900: var(--b9);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* every heading uses var(--font-heading) inline — force it heavy */
  [style*="--font-heading"] { font-weight: 700; }
  html, body { margin: 0; }
  body {
    font-family: var(--font-body);
    color: var(--color-text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background:
      radial-gradient(120% 80% at 50% -10%, #efe7d8, #e6d8bf 70%),
      #e6d8bf;
  }
  a { color: var(--color-accent); }
  a:hover { color: var(--color-accent-700); }
  .sx::-webkit-scrollbar { display: none; }
  .sx { scrollbar-width: none; }

  /* ── phone frame ── */
  .phone {
    width: 402px;
    height: 874px;
    max-height: calc(100vh - 48px);
    border-radius: 48px;
    overflow: hidden;
    position: relative;
    background: var(--color-bg);
    box-shadow: 0 40px 80px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.12);
    -webkit-font-smoothing: antialiased;
  }
  .island {
    position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
    width: 126px; height: 37px; border-radius: 24px; background: #000; z-index: 50;
  }
  .statusbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 40;
    display: flex; align-items: center; justify-content: space-between;
    padding: 19px 30px 0; pointer-events: none;
  }
  .statusbar .time {
    font-family: -apple-system, "SF Pro", system-ui; font-weight: 600;
    font-size: 15px; color: var(--color-text);
  }
  .homebar {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 60;
    height: 30px; display: flex; justify-content: center; align-items: flex-end;
    padding-bottom: 8px; pointer-events: none;
  }
  .homebar > div {
    width: 139px; height: 5px; border-radius: 100px;
    background: color-mix(in srgb, var(--color-text) 30%, transparent);
  }
  button { font-family: inherit; }

  /* ── accent palettes — each swaps the seed ramps only ── */
  body.pal-forest {
    --a1:#eef6e6; --a2:#d7ecc6; --a3:#b6dc9c; --a4:#8fc56d; --a5:#6bac48; --a6:#528d34; --a7:#3f6c28; --a8:#2b4a1d; --a9:#1c3113; --a-base:#5a9440;
    /* teal secondary — cool, no orange */
    --b1:#e3f4f1; --b2:#c2e7e0; --b3:#93d3c8; --b4:#5cb8aa; --b5:#329888; --b6:#217a6d; --b7:#1a5d53; --b8:#14413a; --b9:#0d2b26; --b-base:#329888;
  }
  body.pal-ocean {
    --a1:#e7f1f8; --a2:#c6e1ef; --a3:#95c8e2; --a4:#5ba9cf; --a5:#3089b6; --a6:#206d97; --a7:#195374; --a8:#143c51; --a9:#0e2836; --a-base:#2f88b4;
    /* plum secondary — cool, no orange */
    --b1:#f3ecf6; --b2:#e3d3ea; --b3:#ccb0d9; --b4:#ad86c1; --b5:#8f63a6; --b6:#734b88; --b7:#583a68; --b8:#3d2848; --b9:#281a2f; --b-base:#8f63a6;
  }
  body.pal-graphite {
    --a1:#f1efec; --a2:#ddd9d2; --a3:#c2bcb0; --a4:#a0978a; --a5:#7f7566; --a6:#615849; --a7:#473f34; --a8:#2f2a22; --a9:#1c1813; --a-base:#6f6557;
    --b1:#eef1f4; --b2:#d7dee6; --b3:#b6c2d0; --b4:#8ea0b4; --b5:#6a7d94; --b6:#516375; --b7:#3d4b59; --b8:#2a333d; --b9:#1a2027; --b-base:#6a7d94;
  }

  /* ── dark theme: bg/surface/text flip, tonal ramps invert so every
     "accent-200 bg + accent-800 text" pair stays readable on dark ── */
  body.dark {
    --color-bg: #1b1815;
    --color-surface: #262019;
    --color-text: #f2e9da;
    --color-divider: color-mix(in srgb, #f2e9da 15%, transparent);

    --color-neutral-100: #2e2b25;
    --color-neutral-200: #474238;
    --color-neutral-300: #645c50;
    --color-neutral-400: #82796a;
    --color-neutral-500: #a19786;
    --color-neutral-600: #c0b6a5;
    --color-neutral-700: #dcd3c4;
    --color-neutral-800: #eee7db;
    --color-neutral-900: #f9f4ed;

    /* invert the seed ramp step-for-step, works for any palette */
    --color-accent-100: var(--a9); --color-accent-200: var(--a8); --color-accent-300: var(--a7); --color-accent-400: var(--a6); --color-accent-500: var(--a5); --color-accent-600: var(--a4); --color-accent-700: var(--a3); --color-accent-800: var(--a2); --color-accent-900: var(--a1);
    --color-accent-2-100: var(--b9); --color-accent-2-200: var(--b8); --color-accent-2-300: var(--b7); --color-accent-2-400: var(--b6); --color-accent-2-500: var(--b5); --color-accent-2-600: var(--b4); --color-accent-2-700: var(--b3); --color-accent-2-800: var(--b2); --color-accent-2-900: var(--b1);

    --shadow-sm: 0 1px 2px rgba(0,0,0,.5);
    --shadow-md: 0 3px 12px rgba(0,0,0,.55);
    --shadow-lg: 0 14px 34px rgba(0,0,0,.6);
    background: #14110f;
  }
  body.dark .phone { box-shadow: 0 40px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.06); }

  @media (max-width: 640px) {
    body { padding: 0; background: var(--color-bg); }
    .phone {
      width: 100vw; height: 100vh; max-height: none;
      border-radius: 0; box-shadow: none;
    }
    .island { display: none; }
  }
</style>
</head>

    try { wrap.setPointerCapture(e.pointerId); } catch(_){}
  });
  wrap.addEventListener('pointermove', e => {
    if (!dragging) return;
    if (Math.abs(e.clientY - startY) > 3) moved = true;
    paint(startT + (e.clientY - startY), false);      // 1:1 finger tracking
  });
  wrap.addEventListener('pointerup', () => {
    if (!dragging) return;
    dragging = false;
    if (moved) paint(H/2 - (sel + 0.5)*itemH, true);   // eased snap to nearest; stays open
  });
  wrap.addEventListener('pointercancel', () => { dragging = false; });
  wrap.addEventListener('contextmenu', e => e.preventDefault());
  return wrap;
}
function saveSession(){
  const w = S.w;
  const day = S.week[firstTrain()];
  const hist = clone(S.hist);
  let log = S.log;
  let slapDay = null;   // set to the finished day so the strip sticker slaps in on the next render
  if (w){
    const mins = Math.max(1, Math.round((Date.now() - w.start)/60000));
    hist[day.name] = (hist[day.name] || []).concat(mins);
    const sets = [];
    w.queue.forEach(q => q.done.forEach(x => sets.push({id:q.id, g:EX[q.id].g, kg:x.kg, reps:x.reps})));
    if (sets.length){
      const vol = sets.reduce((a,x) => a + x.kg*x.reps, 0);
      const today = ymd(new Date());
      log = [...(S.log||[]), {date:today, name:day.name, sets, vol, mins}];
      slapDay = today;
    }
  }
  setState({hist, log, overlay:null, w:null, tab:'today', slapDay});
}

    )
  );

  // muscle balance — real logged sets over the last 30 days (falls back to plan estimate if nothing logged yet)
  const setsBy = {}; GROUPS.forEach(g => setsBy[g] = 0);
  const cutoff = new Date(); cutoff.setHours(0,0,0,0); cutoff.setDate(cutoff.getDate()-30);
  let logged = 0;
  (S.log||[]).forEach(r => { if (parseYmd(r.date) >= cutoff) r.sets.forEach(s => { if (s.g in setsBy){ setsBy[s.g]++; logged++; } }); });
  if (!logged) S.week.forEach(d => d.ex.forEach(id => setsBy[EX[id].g] += EX[id].sets * 4));
  const balSub = logged ? 'Last 30 days' : 'Last month';
  const top = Math.max(1, ...Object.values(setsBy));
  const balCard = h('div', {style:{background:'var(--color-surface)',borderRadius:'var(--radius-md)',padding:'18px',boxShadow:'var(--shadow-sm)'}},
    h('div', {style:{display:'flex',alignItems:'baseline',justifyContent:'space-between',marginBottom:'14px'}},
      h('div', {style:{fontFamily:'var(--font-heading)',fontSize:'18px'}}, 'Muscle balance'),
      h('div', {style:{fontSize:'12px',color:'var(--color-neutral-600)'}}, balSub)
    ),
    GROUPS.map(g => {
      const ratio = setsBy[g]/top;
      return h('div', {style:{marginBottom:'12px'}},
        h('div', {style:{display:'flex',justifyContent:'space-between',fontSize:'12px',fontWeight:'600',marginBottom:'5px'}},
          h('span', {}, g), h('span', {style:{color:'var(--color-neutral-600)'}}, setsBy[g] + ' sets')),
        h('div', {style:{height:'9px',borderRadius:'999px',background:'var(--color-neutral-300)',overflow:'hidden'}},
          h('div', {style:{height:'100%',borderRadius:'999px',background:(ratio>0.55?'var(--color-accent-2-600)':'var(--color-accent-400)'),width:Math.round(ratio*100)+'%'}}))
      );
    })
  );

  return h('div', {style:{padding:'6px 22px 152px'}},
    h('h2', {style:{fontFamily:'var(--font-heading)',fontSize:'30px',margin:'0 0 16px'}}, 'Progress'),
    consistency, chartCard, balCard
  );
}

/* ── overlay: workout ── */
function viewWorkout(){
  const w = S.w;
  if (!w) return null;
  const wStep = S.unit === 'lb' ? 5 : 2.5;
  const uLbl = S.unit;
  const totalSets = w.queue.reduce((n,q) => n+q.sets, 0);
  const logged = w.queue.reduce((n,q) => n+q.done.length, 0);
  const vol = w.queue.reduce((n,q) => n + q.done.reduce((m,x) => m + x.kg*x.reps, 0), 0);
  const elapsed = Math.floor((Date.now() - w.start)/1000);
  const wClock = Math.floor(elapsed/60) + ':' + String(elapsed%60).padStart(2,'0') + ' elapsed';

  const dots = h('div', {style:{display:'flex',gap:'4px',padding:'12px 22px 0'}},
    w.queue.flatMap((q,qi) => Array.from({length:q.sets}, (_,i) => {
      const bg = i < q.done.length ? 'var(--color-accent-2-600)' : (qi === w.ei && i === w.si && !w.done ? 'var(--color-accent)' : 'var(--color-neutral-300)');

  const topBar = h('div', {style:{padding:'58px 22px 6px',display:'flex',alignItems:'center',gap:'12px'}},

    h('div', {style:{flex:'1',fontSize:'12px',color:'var(--color-neutral-700)',fontWeight:'600'}}, wClock),
    h('div', {style:{fontSize:'12px',fontWeight:'700',color:'var(--color-accent-700)'}}, Math.round(vol) + ' ' + uLbl)
  );

  let body;
  if (w.done){
    const summary = w.queue.filter(q => q.done.length).map(q => h('div', {style:{padding:'8px 0',borderBottom:'1px solid var(--color-divider)'}},
      h('div', {style:{fontSize:'14px',fontWeight:'600'}}, EX[q.id].n),
      h('div', {style:{fontSize:'12px',color:'var(--color-neutral-700)',marginTop:'2px'}}, q.done.map(x => x.kg + uLbl + ' × ' + x.reps).join('   '))
    ));
    const day = S.week[firstTrain()];
    body = h('div', {style:{flex:'1',display:'flex',flexDirection:'column',padding:'26px 22px 34px'}},
      h('div', {style:{fontSize:'11px',letterSpacing:'.14em',textTransform:'uppercase',color:'var(--color-accent-700)',fontWeight:'700'}}, 'Session complete'),

      h('div', {style:{display:'flex',gap:'10px',marginBottom:'16px'}},

          h('div', {style:{fontFamily:'var(--font-heading)',fontSize:'26px',lineHeight:'1',color:'var(--color-accent-800)'}}, Math.round(vol)),
          h('div', {style:{fontSize:'10px',letterSpacing:'.08em',textTransform:'uppercase',fontWeight:'700',color:'var(--color-accent-700)',marginTop:'5px'}}, uLbl + ' volume')),
        h('div', {style:{flex:'1',background:'var(--color-accent-2-200)',borderRadius:'var(--radius-md)',padding:'15px'}},
          h('div', {style:{fontFamily:'var(--font-heading)',fontSize:'26px',lineHeight:'1',color:'var(--color-accent-2-800)'}}, logged),
          h('div', {style:{fontSize:'10px',letterSpacing:'.08em',textTransform:'uppercase',fontWeight:'700',color:'var(--color-accent-2-700)',marginTop:'5px'}}, 'Sets')),
        h('div', {style:{flex:'1',background:'var(--color-neutral-200)',borderRadius:'var(--radius-md)',padding:'15px'}},
          h('div', {style:{fontFamily:'var(--font-heading)',fontSize:'26px',lineHeight:'1'}}, Math.floor(elapsed/60) + 'm'),
          h('div', {style:{fontSize:'10px',letterSpacing:'.08em',textTransform:'uppercase',fontWeight:'700',color:'var(--color-neutral-700)',marginTop:'5px'}}, 'Duration'))

    const restClock = Math.floor(left/60) + ':' + String(left%60).padStart(2,'0');
    const restOffset = 339.3 * (1 - left/rest());
    const ex = EX[w.queue[w.ei].id];
    const ring = svg({viewBox:'0 0 120 120', style:'width:100%;height:100%;transform:rotate(-90deg)'},
      '<circle cx="60" cy="60" r="54" fill="none" stroke="var(--color-neutral-300)" stroke-width="9"></circle>'+
      '<circle cx="60" cy="60" r="54" fill="none" stroke="var(--color-accent-2-600)" stroke-width="9" stroke-linecap="round" stroke-dasharray="339.3" stroke-dashoffset="'+restOffset+'"></circle>'

    body = h('div', {style:{flex:'1',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'22px 22px 40px',gap:'6px'}},
      h('div', {style:{fontSize:'11px',letterSpacing:'.14em',textTransform:'uppercase',color:'var(--color-accent-2-700)',fontWeight:'700'}}, 'Rest'),
      h('div', {style:{position:'relative',width:'230px',height:'230px',margin:'10px 0 6px'}},
        ring,
        h('div', {style:{position:'absolute',inset:'0',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}},
          h('div', {style:{fontFamily:'var(--font-heading)',fontSize:'52px',lineHeight:'1',letterSpacing:'-.02em'}}, restClock),
          h('div', {style:{fontSize:'12px',color:'var(--color-neutral-700)',marginTop:'6px'}}, 'Next: set ' + (w.queue[w.ei].done.length+1) + ' · ' + ex.n)

          lastSet

                spinField({size:'mini', value:lastSet.kg, label:uLbl, min:0, max:(uLbl==='lb'?600:300), step:0.25, onPick:v => adjustLastTo('kg', v)}),
                spinField({size:'mini', value:lastSet.reps, label:'reps', min:1, max:50, step:1, onPick:v => adjustLastTo('reps', v)})
              )
            : h('div', {style:{fontFamily:'var(--font-heading)',fontSize:'20px',marginTop:'4px'}}, w.last || '')

      h('button', {style:{width:'100%',background:'transparent',border:'1px solid var(--color-divider)',cursor:'pointer',borderRadius:'999px',padding:'13px',fontFamily:'var(--font-heading)',fontSize:'14px',color:'var(--color-text)'}, hover:{background:'color-mix(in srgb, var(--color-text) 7%, transparent)'}, onClick:() => setState({w:{...w, restEnd:w.restEnd + 30000}})}, '+30 seconds')
    );
  } else {

        h('div', {style:{background:'var(--color-surface)',borderRadius:'var(--radius-lg)',padding:'18px',display:'flex',justifyContent:'center'}},
          spinField({value:w.kg, label:S.unit + ' · tap to edit', min:0, max:(S.unit==='lb'?600:300), step:0.25, onPick:v => setState({w:{...S.w, kg:v}})})),
        h('div', {style:{background:'var(--color-surface)',borderRadius:'var(--radius-lg)',padding:'18px',display:'flex',justifyContent:'center'}},
          spinField({value:w.reps, label:'reps · tap to edit', min:1, max:50, step:1, onPick:v => setState({w:{...S.w, reps:Math.round(v)}})})),
        h('button', {style:primaryBtn({padding:'19px',fontSize:'19px'}), hover:primaryHover, active:primaryActive, onClick:logSet}, 'Log set')
      )
    );
  }

  return h('div', {style:{position:'absolute',inset:'0',background:'var(--color-bg)',display:'flex',flexDirection:'column',zIndex:'70'}},
    topBar, dots, body

// Bottom sheet: what you actually did on a logged day. Opened by tapping a done day (week strip or calendar).
function viewDayDetail(){
  if (!S.dayDetail) return null;
  const sessions = (S.log||[]).filter(r => r.date === S.dayDetail);
  const dt = parseYmd(S.dayDetail);
  const heading = dt.toLocaleString('en-US', {weekday:'long', month:'long', day:'numeric'});

  const body = sessions.length ? sessions.map(sess => {
    const setRows = sess.sets.map((s,i) => {
      const g = GROUP_COLOR[s.g] || GROUP_COLOR[GROUPS[0]];
      const name = (EX[s.id] && EX[s.id].n) || s.id;
      return h('div', {style:{display:'flex',alignItems:'center',gap:'12px',padding:'10px 0',borderBottom:(i<sess.sets.length-1?'1px solid var(--color-divider)':'none')}},
        h('div', {style:{width:'26px',height:'26px',flex:'none',borderRadius:'999px',background:g[0],color:g[1],display:'flex',alignItems:'center',justifyContent:'center',fontSize:'11px',fontWeight:'700'}}, i+1),
        h('div', {style:{flex:'1',minWidth:'0',fontSize:'15px',fontWeight:'600',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}, name),
        h('div', {style:{flex:'none',fontFamily:'var(--font-heading)',fontSize:'17px'}}, (s.kg ? s.kg + ' kg' : 'Body') + ' × ' + s.reps)
      );
    });
    return h('div', {style:{marginBottom:'16px'}},
      h('div', {style:{display:'flex',alignItems:'baseline',justifyContent:'space-between',marginBottom:'6px'}},
        h('div', {style:{fontFamily:'var(--font-heading)',fontSize:'21px'}}, sess.name),
        h('div', {style:{fontSize:'12px',color:'var(--color-neutral-600)',fontWeight:'600'}}, Math.round(sess.vol) + ' kg · ' + sess.mins + ' min')
      ),
      h('div', {style:{background:'var(--color-surface)',borderRadius:'var(--radius-md)',padding:'4px 16px',boxShadow:'var(--shadow-sm)'}}, ...setRows)
    );
  }) : [h('div', {style:{fontSize:'14px',color:'var(--color-neutral-600)',padding:'8px 0 20px'}}, 'Nothing logged this day.')];

  const panel = h('div', {id:'daySheet', class:'sx', style:{width:'86%',maxWidth:'340px',maxHeight:'78%',overflowY:'auto',background:'var(--color-bg)',borderRadius:'var(--radius-lg)',padding:'20px 22px 24px',boxShadow:'0 18px 50px rgba(0,0,0,.4)'},
      onClick:(ev) => ev.stopPropagation()},
    h('div', {style:{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:'10px',marginBottom:'16px'}},
      h('h3', {style:{fontFamily:'var(--font-heading)',fontSize:'23px',margin:'0',marginLeft:'34px',lineHeight:'1.05'}}, heading),
      h('button', {style:{flex:'none',width:'30px',height:'30px',borderRadius:'999px',border:'none',cursor:'pointer',background:'var(--color-neutral-200)',color:'var(--color-neutral-700)',fontSize:'16px',lineHeight:'1'}, onClick:() => setState({dayDetail:null})}, '✕')
    ),
    ...body
  );
  // Wrap the panel so the corner sticker can spill past its edge (panel itself clips with overflowY:auto).
  const wrapped = h('div', {style:{position:'relative',display:'flex'},
      onClick:(ev) => ev.stopPropagation()},
    panel,
    // Slapped-on sticker: tilted, die-cut rim, hangs off the top-left corner.
    stickerNode(S.dayDetail, 62, {position:'absolute',top:'-24px',left:'-22px',transform:'rotate(-17deg)',filter:STICKER_FILTER,zIndex:'2'})
  );
  return h('div', {id:'daySheetBackdrop', style:{position:'absolute',inset:'0',background:'rgba(32,30,29,.45)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:'80'},
      onClick:() => setState({dayDetail:null})}, wrapped);
}

/* ══════════════════════════════════════════════════════════════
   Render
   ══════════════════════════════════════════════════════════════ */
const phone = document.getElementById('phone');
function render(){
  let scroll = null;
  if (phone._scroll) scroll = phone._scroll.scrollTop;

  const content = S.tab === 'plans' ? viewPlans() : S.tab === 'progress' ? viewProgress() : S.tab === 'settings' ? viewSettings() : viewToday();
  const scrollArea = h('div', {class:'sx', style:{flex:'1',overflowY:'auto',overflowX:'hidden'}}, content);

  const app = h('div', {style:{height:'100%',display:'flex',flexDirection:'column',background:'var(--color-bg)',fontFamily:'var(--font-body)',color:'var(--color-text)',position:'relative',overflow:'hidden'}},
    header(),
    scrollArea,
    tabBar(),
    S.overlay === 'builder' && viewBuilder(),
    S.overlay === 'workout' && viewWorkout(),
    S.overlay === 'plans' && viewPlanPicker(),
    viewSheet(),
    viewDayDetail()
  );

  phone.innerHTML = '';
  phone.append(
    h('div', {class:'island'}),
    statusBar(),
    app,
    h('div', {class:'homebar'}, h('div', {}))
  );
  phone._scroll = scrollArea;
  if (scroll != null) scrollArea.scrollTop = scroll;

  // The tapped day grows fast and "jumps" into the middle of the screen, blooming into the card.
  if (S.dayDetail && S.dayFrom){
    const sheet = document.getElementById('daySheet'), backdrop = document.getElementById('daySheetBackdrop');
    if (sheet){
      const r = sheet.getBoundingClientRect();
      const cx = r.left + r.width/2, cy = r.top + r.height/2;   // card centre (screen)
      const dx = S.dayFrom.x - cx, dy = S.dayFrom.y - cy;       // offset from centre to tapped icon
      sheet.animate([
        {transform:'translate('+dx+'px,'+dy+'px) scale(.12)', opacity:0,   offset:0},
        {transform:'translate('+(dx*0.12)+'px,'+(dy*0.12)+'px) scale(1.08)', opacity:1, offset:0.75},
        {transform:'translate(0,0) scale(1)', opacity:1, offset:1}
      ], {duration:420, easing:'cubic-bezier(.34,1.4,.5,1)'});
      if (backdrop) backdrop.animate([{opacity:0},{opacity:1}], {duration:200, easing:'ease-out'});
    }
    S.dayFrom = null;   // don't replay on later re-renders while the card stays open
  }

  // Just-finished workout: the day's sticker slaps onto the week strip (drops in big → smacks → settles).
  if (S.slapDay){
    const el = document.getElementById('strip-sticker-'+S.slapDay);
    if (el){
      const base = el.style.transform;   // final transform (centre + jitter + rotate + scale)
      el.animate([
        {transform: base+' scale(1.9)', opacity:0, offset:0},
        {transform: base+' scale(.82)', opacity:1, offset:.32},   // impact squash
        {transform: base+' scale(1.1)', offset:.6},
        {transform: base+' scale(1)',  offset:1}
      ], {duration:460, easing:'cubic-bezier(.3,1.2,.5,1)'});
    }
    S.slapDay = null;
  }
}

// Rest timer / elapsed clock tick — repaint while a workout is live.
setInterval(() => { const w = S.w; if (w && (w.resting || !w.done) && !scrubbing) render(); }, 250);

applyPrefs();
render();
