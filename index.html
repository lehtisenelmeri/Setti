<style>
  /* ── Organic design-system tokens (from _ds/organic .../styles.css) ── */
  :root {
    --color-bg: #F4F3F0;
    --color-surface: #FFFFFF;
    --color-surface-2: #F7F6F3;
    --color-text: #16151A;
    --color-divider: rgba(22,21,26,.08);

    --color-neutral-100: #F5F4F2;
    --color-neutral-200: #EAE8E4;
    --color-neutral-300: #DAD7D1;
    --color-neutral-400: #BEBAB2;
    --color-neutral-500: #9B968D;
    --color-neutral-600: #787369;
    --color-neutral-700: #575249;
    --color-neutral-800: #3A3630;
    --color-neutral-900: #16151A;

    --font-heading: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
    --font-body: "Figtree", system-ui, sans-serif;

    --radius-sm: 12px;
    --radius-md: 18px;
    --radius-lg: 26px;

    --shadow-sm: 0 1px 2px rgba(22,21,26,.05);
    --shadow-md: 0 4px 16px -6px rgba(22,21,26,.13);
    --shadow-lg: 0 14px 34px -12px rgba(22,21,26,.18);
  }

  /* Accent seed ramps live on <body> so palette classes (also on <body>) and
     the numbered mapping below resolve against the SAME element - a var() in a
     :root-declared property would resolve the seed on :root, ignoring the swap. */
  body {
    --a1:#ffe9e2; --a2:#ffcabb; --a3:#ffa88f; --a4:#ff8563; --a5:#fb6440; --a6:#ee4c27; --a7:#c53c1c; --a8:#8f2b14; --a9:#5a1a0c; --a-base:#FB5A34;
    --b1:#e7ecff; --b2:#c6d3ff; --b3:#9cb2ff; --b4:#6b8bff; --b5:#4468ff; --b6:#2b5bff; --b7:#1f45cc; --b8:#163199; --b9:#0e1f66; --b-base:#2B5BFF;

    --color-accent: var(--a-base);
    --color-accent-2: var(--b-base);
    --color-accent-100: var(--a1); --color-accent-200: var(--a2); --color-accent-300: var(--a3); --color-accent-400: var(--a4); --color-accent-500: var(--a5); --color-accent-600: var(--a6); --color-accent-700: var(--a7); --color-accent-800: var(--a8); --color-accent-900: var(--a9);
    --color-accent-2-100: var(--b1); --color-accent-2-200: var(--b2); --color-accent-2-300: var(--b3); --color-accent-2-400: var(--b4); --color-accent-2-500: var(--b5); --color-accent-2-600: var(--b6); --color-accent-2-700: var(--b7); --color-accent-2-800: var(--b8); --color-accent-2-900: var(--b9);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* every heading uses var(--font-heading) inline - condensed sport display */
  [style*="--font-heading"] { font-weight: 700; letter-spacing: 0.005em; }
  html, body { margin: 0; }
  body {
    font-family: var(--font-body);
    color: var(--color-text);
    letter-spacing: -0.006em;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background:
      radial-gradient(120% 80% at 50% -10%, #f7f6f3, #eceae6 70%),
      #eceae6;
  }
  button { transition: transform .12s cubic-bezier(.2,.8,.2,1), opacity .12s ease, filter .12s ease; }
  button:active { transform: scale(.97); }
  a { color: var(--color-accent); }
  a:hover { color: var(--color-accent-700); }
  .sx::-webkit-scrollbar { display: none; }
  .sx { scrollbar-width: none; }

  /* ── phone frame ── */
  .phone {
    width: 402px;
    height: 874px;
    max-height: calc(100vh - 48px);
    border-radius: 48px;
    overflow: hidden;
    position: relative;
    background: var(--color-bg);
    box-shadow: 0 40px 80px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.12);
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }

  /* ── dark theme: bg/surface/text flip, tonal ramps invert so every
     "accent-200 bg + accent-800 text" pair stays readable on dark.
     Single coral accent only - no palette classes. ── */
  body.dark {
    --color-bg: #100F12;
    --color-surface: #1B1A1F;
    --color-surface-2: #232228;
    --color-text: #F4F3F0;
    --color-divider: color-mix(in srgb, #f4f3f0 10%, transparent);

    /* darker, muted accent so big bands don't glare on the dark ground */
    --color-accent: color-mix(in srgb, var(--a-base) 80%, #000);
    --color-accent-2: color-mix(in srgb, var(--b-base) 80%, #000);

    --color-neutral-100: #1B1A1F;
    --color-neutral-200: #232228;
    --color-neutral-300: #333138;
    --color-neutral-400: #4a4750;
    --color-neutral-500: #6f6b76;
    --color-neutral-600: #928d99;
    --color-neutral-700: #bbb6c1;
    --color-neutral-800: #d9d5dd;
    --color-neutral-900: #F4F3F0;

    /* invert the seed ramp step-for-step */
    --color-accent-100: var(--a9); --color-accent-200: var(--a8); --color-accent-300: var(--a7); --color-accent-400: var(--a6); --color-accent-500: var(--a5); --color-accent-600: var(--a4); --color-accent-700: var(--a3); --color-accent-800: var(--a2); --color-accent-900: var(--a1);
    --color-accent-2-100: var(--b9); --color-accent-2-200: var(--b8); --color-accent-2-300: var(--b7); --color-accent-2-400: var(--b6); --color-accent-2-500: var(--b5); --color-accent-2-600: var(--b4); --color-accent-2-700: var(--b3); --color-accent-2-800: var(--b2); --color-accent-2-900: var(--b1);

    --shadow-sm: 0 1px 2px rgba(0,0,0,.5);
    --shadow-md: 0 3px 12px rgba(0,0,0,.55);
    --shadow-lg: 0 14px 34px rgba(0,0,0,.6);
    background: #14110f;
  }
  body.dark .phone { box-shadow: 0 40px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.06); }

  @media (max-width: 640px) {
    html, body { height: 100%; }
    body { padding: 0; background: var(--color-bg); display: block; }
    .phone {
      width: 100vw; height: 100vh; height: 100dvh; max-height: none;
      border-radius: 0; box-shadow: none;
    }
  }
  /* "at the gym" live pulse for friend avatars */
  @keyframes livePulse {
    0%   { box-shadow: 0 0 0 0 rgba(34,175,90,.55); }
    70%  { box-shadow: 0 0 0 8px rgba(34,175,90,0); }
    100% { box-shadow: 0 0 0 0 rgba(34,175,90,0); }
  }
  .live-ring { animation: livePulse 1.8s ease-out infinite; }
  .live-dot  { animation: livePulse 1.8s ease-out infinite; }
  /* week-strip completion stamp: solid check drops into the holster on finish */
  @keyframes stampIn {
    0%   { opacity: 0; transform: translateY(-10px) scale(1.9); }
    26%  { opacity: 1; transform: translateY(0) scale(.84); }   /* impact squash */
    42%  { transform: scale(1.1); }
    62%  { transform: scale(.97); }
    100% { opacity: 1; transform: scale(1); }
  }
  /* ── global tap feel: gentle press-in + smooth colour/shadow easing on every control ── */
  button {
    -webkit-tap-highlight-color: transparent;
    transition: transform .13s cubic-bezier(.2,.7,.3,1), box-shadow .18s ease, background-color .16s ease, color .16s ease, border-color .16s ease, opacity .14s ease;
  }
  button:active { transform: scale(.955); }
  /* opt-in press for clickable non-button surfaces (cards, pills, list rows) */
  .tap { -webkit-tap-highlight-color: transparent; transition: transform .14s cubic-bezier(.2,.7,.3,1), box-shadow .18s ease, background-color .16s ease; }
  .tap:active { transform: scale(.975); }
  @media (prefers-reduced-motion: reduce) {
    button:active, .tap:active { transform: none; }
  }
</style>
</head>

/* ══════════════════════════════════════════════════════════════
   Tiny DOM helper - h(tag, props, ...children).
   Supports style object, event handlers, and style-hover / -active.
   ══════════════════════════════════════════════════════════════ */
function h(tag, props, ...kids){
  const el = document.createElement(tag);
  props = props || {};
  let base = null, hover = null, active = null;
  for (const k in props){
    const val = props[k];
    if (val == null || val === false) continue;
    if (k === 'style'){ Object.assign(el.style, val); base = {...val}; }
    else if (k === 'hover') hover = val;
    else if (k === 'active') active = val;
    else if (k === 'html') el.innerHTML = val;
    else if (k === 'class') el.className = val;
    else if (k === 'draggable') el.draggable = val;
    else if (k.slice(0,2) === 'on' && typeof val === 'function'){
      el.addEventListener(k.slice(2).toLowerCase(), val);
    }
    else el.setAttribute(k, val);
  }
  const applyBase = () => base && Object.assign(el.style, base);
  if (hover){
    el.addEventListener('mouseenter', () => Object.assign(el.style, hover));
    el.addEventListener('mouseleave', applyBase);
  }
  if (active){
    el.addEventListener('mousedown', () => Object.assign(el.style, active));
    const up = () => Object.assign(el.style, hover || base || {});
    el.addEventListener('mouseup', up);
    el.addEventListener('mouseleave', applyBase);
  }
  for (const c of kids.flat()){
    if (c == null || c === false) continue;
    el.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return el;
}
// convenience
const svgNS = 'http://www.w3.org/2000/svg';
function svg(attrs, inner){
  const el = document.createElementNS(svgNS, 'svg');
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  el.innerHTML = inner;
  return el;
}

// Live stat for one member: current exercise, sets done / total, volume, done flag.

    const setsDone = w ? w.queue.reduce((n,q) => n + q.done.length, 0) : 0;
    const vol = w ? w.queue.reduce((n,q) => n + q.done.reduce((m,x) => m + x.kg*x.reps, 0), 0) : 0;
    const cur = w && w.queue[w.ei];
    const done = !!(w && (w.done || w.wrap));
    const exBreak = w ? w.queue.map(q => ({sets:q.sets, done:q.done.length})) : [];   // one entry per exercise
    return {id, name:'You', fr:null, isMe:true, vol:Math.round(vol), setsDone, setsTotal:Math.max(1, setsTotal, setsDone),

  const elapsed = (S.group ? (Date.now() - S.group.startedAt) / 1000 : 0) + head;
  const doneCount = Math.max(0, Math.min(total, Math.floor(elapsed / perSet)));
  let vol = 0; for (let i = 0; i < doneCount; i++){ const e = EX[sets[i]]; if (e) vol += (e.kg || 0) * (parseInt(e.reps) || 10); }
  const order = []; sets.forEach(sid => { if (order[order.length-1] !== sid) order.push(sid); });
  const done = doneCount >= total;
  const curId = sets[Math.min(doneCount, total - 1)];

/* ══════════════════════════════════════════════════════════════
   Views
   ══════════════════════════════════════════════════════════════ */
function viewToday(){
  const ti = todayIdx();
  const today = S.week[ti];
  const plan = PLANS[S.planId];
  const est = estimate(today);
  const restToday = today.ex.length === 0;
  const wActive = !!(S.w && !S.w.done);   // a session is running (probably minimised)

  const weekFlags = doneThisWeek();
  const monDate = weekStart(new Date());
  // ── colourful day pills: done = coral check, scheduled = ring, rest = dot ──
  const weekBar = h('div', {style:{display:'flex',gap:'6px'}},
    DAY_LBL.map((lbl,i) => {
      const isTi = i === ti;
      const isRest = S.week[i] && S.week[i].ex.length === 0;
      const done = weekFlags[i] && !isRest;
      const dayDate = new Date(monDate); dayDate.setDate(monDate.getDate()+i);
      const cap = lbl.charAt(0) + lbl.slice(1).toLowerCase();
      const marker = isRest
        ? h('div', {style:{width:'8px',height:'8px',borderRadius:'999px',background:'var(--color-neutral-300)'}})
        : done
        ? (() => { const node = doneMark(30); node.id = 'strip-sticker-'+ymd(dayDate); return node; })()
        : holsterMark(30);
      return h('div', {...(done?{class:'tap'}:{}), style:{flex:'1',display:'flex',flexDirection:'column',alignItems:'center',gap:'9px',padding:'12px 0',borderRadius:'18px',cursor:done?'pointer':'default',background:(isTi?'var(--color-surface)':'transparent'),boxShadow:(isTi?'var(--shadow-sm)':'none')}, onClick:done?((ev) => setState({dayDetail:ymd(dayDate), dayFrom:{x:ev.clientX, y:ev.clientY}})):null},
        h('div', {style:{fontSize:'12px',fontWeight:'700',color:(isTi?'var(--color-accent)':'var(--color-neutral-500)')}}, cap),
        h('div', {style:{height:'34px',display:'flex',alignItems:'center',justifyContent:'center'}}, marker)
      );
    })
  );

  // ── quick invite: friends with no logged session today (and not mid-workout) ──
  const friendsList = (S.social && S.social.friends) || FRIENDS;
  const feedList = (S.social && S.social.feed) || FEED;
  const todayYmd = ymd(new Date());
  const trainedToday = feedList.filter(p => p.date === todayYmd).reduce((s,p) => (s[p.userId] = 1, s), {});
  const idle = friendsList.filter(f => !trainedToday[f.id] && !isLive(f));
  const idleIds = idle.map(f => f.id);
  const avatarStack = h('div', {style:{display:'flex',flex:'none'}},
    idle.slice(0,5).map((f,i) => h('div', {style:{marginLeft:(i?'-10px':'0'),borderRadius:'999px',border:'2px solid var(--color-surface)'}}, avatar(f, 34)))
  );
  const quickInvite = h('div', {style:{background:'var(--color-surface)',borderRadius:'var(--radius-lg)',boxShadow:'var(--shadow-sm)',padding:'18px 20px 20px',marginBottom:'14px'}},
    h('div', {style:{display:'flex',alignItems:'center',justifyContent:'space-between',gap:'12px',marginBottom:(idle.length?'16px':'0')}},
      h('div', {style:{minWidth:'0'}},
        h('div', {style:{fontSize:'12px',fontWeight:'800',letterSpacing:'0.06em',color:'var(--color-accent)'}}, 'Quick invite'),
        h('div', {style:{fontFamily:'var(--font-heading)',fontSize:'24px',marginTop:'3px'}},
          idle.length === 0 ? 'Crew is all trained' : idle.length + (idle.length === 1 ? ' friend free to lift' : ' friends free to lift'))
      ),
      idle.length ? avatarStack : null
    ),
    idle.length
      ? h('button', {style:primaryBtn({padding:'15px',fontSize:'16px'}), hover:primaryHover, active:primaryActive, onClick:() => setState({invitePanel:true, inviteFriends:idleIds.slice(), inviteWhen:'now'})}, 'Invite to the gym')
      : h('div', {style:{fontSize:'15px',color:'var(--color-neutral-600)'}}, 'Everyone’s already logged a session today.')
  );

  const weekStrip = h('div', {style:{marginBottom:'22px'}}, weekBar);

  // group same-muscle exercises together (stable)
  const orderedEx = today.ex.slice().sort((a,b) => GROUPS.indexOf(EX[a].g) - GROUPS.indexOf(EX[b].g));
  const exRows = orderedEx.map((id,xi) => {
    const g = GROUP_COLOR[EX[id].g];
    const last = xi === orderedEx.length - 1;
    return h('div', {style:{display:'flex',alignItems:'center',gap:'12px',padding:'13px 0',borderBottom:(last?'none':'1px solid var(--color-divider)')}},
      h('span', {style:{width:'10px',height:'10px',flex:'none',borderRadius:'999px',background:g[2]}}),
      h('div', {style:{flex:'1',minWidth:'0',fontSize:'16px',fontWeight:'600',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}, EX[id].n),
      h('div', {style:{flex:'none',fontSize:'13px',fontWeight:'600',color:'var(--color-neutral-500)'}}, EX[id].g)
    );
  });

  const ghostBtn = (label, onClick) => h('button', {style:{flex:'1',background:'var(--color-neutral-100)',border:'none',cursor:'pointer',borderRadius:'14px',padding:'14px',fontFamily:'var(--font-heading)',fontSize:'14px',fontWeight:'700',color:'var(--color-text)'}, onClick}, label);

  // ── main card ──
  const card = restToday
    ? h('div', {style:{background:'var(--color-surface)',borderRadius:'var(--radius-lg)',boxShadow:'var(--shadow-md)',padding:'26px 24px 26px'}},
        h('div', {style:{fontSize:'12px',fontWeight:'800',letterSpacing:'0.06em',color:'var(--color-accent)',marginBottom:'8px'}}, DAY_FULL[ti]),
        h('div', {style:{fontFamily:'var(--font-heading)',fontSize:'32px'}}, 'Rest day'),
        h('div', {style:{fontSize:'16px',color:'var(--color-neutral-600)',lineHeight:'1.5',margin:'10px 0 22px'}}, restQuote()),
        h('button', {style:primaryBtn({padding:'17px',fontSize:'17px'}), hover:primaryHover, active:primaryActive, onClick:startEmptyWorkout}, wActive ? 'Back to workout' : 'Start an empty workout')
      )
    : h('div', {style:{borderRadius:'var(--radius-lg)',overflow:'hidden',boxShadow:'0 16px 34px -12px color-mix(in srgb, var(--color-accent) 60%, transparent)'}},
        h('div', {style:{background:'var(--color-accent)',color:'#fff',padding:'24px 24px 22px'}},
          h('div', {style:{fontSize:'12px',fontWeight:'800',letterSpacing:'0.06em',opacity:'.9'}}, DAY_FULL[ti]),
          h('div', {style:{fontFamily:'var(--font-heading)',fontSize:'36px',lineHeight:'1.02',marginTop:'2px'}}, today.name + ' day'),
          h('div', {style:{fontSize:'14px',fontWeight:'600',opacity:'.9',marginTop:'6px',marginBottom:'20px'}}, orderedEx.length + ' exercises · about ' + est.min + ' min'),
          h('button', {style:{width:'100%',border:'none',cursor:'pointer',background:'#fff',color:'var(--color-accent)',borderRadius:'12px',padding:'17px',fontFamily:'var(--font-heading)',fontWeight:'800',fontSize:'17px',letterSpacing:'-0.01em'}, onClick:startWorkout}, wActive ? 'Back to workout' : 'Start workout'),
        ),
        h('div', {style:{background:'var(--color-surface)',padding:'6px 22px 18px'}},
          ...exRows,
          h('div', {style:{display:'flex',gap:'10px',marginTop:'16px'}},
            ghostBtn('Swap exercises', () => setState({overlay:'builder', day:ti})),
            ghostBtn(wActive ? 'Back to workout' : 'Empty workout', startEmptyWorkout)
          )
        )
      );

  // ── accepted gym invites → the upcoming session, shown on Today ──
  const upcoming = S.invites.filter(v => { const me = myEntry(v); return me && me.status === 'accepted'; });
  const upcomingCards = upcoming.map(v => {
    const goingIds = [v.host].concat(v.invitees.filter(x => x.id !== 'me' && x.status === 'accepted').map(x => x.id));
    const names = joinNames(goingIds.map(firstNameOf));
    const hostFr = friendById(v.host);
    const w = v.host === 'me' ? S.week[ti] : (hostFr && hostFr.week && hostFr.week[ti]);
    const wname = (w && w.ex && w.ex.length) ? w.name : 'Gym';
    const whenTxt = v.time === 'now' ? 'right now' : 'at ' + v.time;
    return h('div', {style:{background:'var(--color-accent)',color:'#fff',borderRadius:'var(--radius-lg)',padding:'18px 20px',marginBottom:'14px',boxShadow:'0 12px 28px -12px color-mix(in srgb, var(--color-accent) 60%, transparent)'}},
      h('div', {style:{fontSize:'12px',fontWeight:'800',letterSpacing:'0.06em',opacity:'.9'}}, 'Gym session'),
      h('div', {style:{fontFamily:'var(--font-heading)',fontSize:'22px',marginTop:'3px',lineHeight:'1.12'}}, wname + ' with ' + names),
      h('div', {style:{fontSize:'14px',fontWeight:'700',opacity:'.95',marginTop:'4px'}}, whenTxt)
    );
  });

  const now = new Date();
  const dateLine = DAY_FULL[ti] + ', ' + now.getDate() + ' ' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][now.getMonth()];

  const streak = myStreak();

  return h('div', {style:{padding:'12px 20px 156px'}},
    h('div', {style:{display:'flex',alignItems:'center',justifyContent:'space-between',gap:'14px',margin:'0 0 20px'}},
      h('div', {style:{minWidth:'0'}},
        h('div', {style:{fontSize:'14px',fontWeight:'600',color:'var(--color-neutral-500)',marginBottom:'2px'}}, dateLine),
        h('h2', {style:{fontFamily:'var(--font-heading)',fontSize:'40px',lineHeight:'1',margin:'0'}}, 'Today')
      ),
      streak > 0 ? h('div', {title:streak + ' day streak', style:{flex:'none',lineHeight:'0'}}, streakBadge(48, streak)) : null
    ),
    ...upcomingCards,
    upcoming.length ? null : quickInvite,   // hide quick invite when a group session is already pending
    weekStrip,
    card
  );
}

function viewPlans(){
  const plan = PLANS[S.planId];
  // Weekly split inside the green card - tap a training day to expand its exercises.
  const splitRows = S.week.map((d,i) => {
    const open = S.planOpen === i;
    const has = d.ex.length > 0;
    const header = h('div', {...(has?{class:'tap'}:{}), style:{display:'flex',alignItems:'center',gap:'12px',padding:'12px 10px',cursor:has?'pointer':'default',borderRadius:'10px',background:(open?'rgba(255,255,255,.14)':'transparent'),transition:'background .12s'}, onClick:has?(() => setState({planOpen: open ? null : i})):null},
      h('div', {style:{width:'34px',flex:'none',fontSize:'11px',letterSpacing:'0',fontWeight:'700',opacity:'.7'}}, DAY_LBL[i].slice(0,3)),
      h('div', {style:{flex:'1',minWidth:'0',fontSize:'15px',fontWeight:(has?'600':'400'),opacity:(has?'1':'.6'),whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}, has ? d.name : 'Rest'),
      has ? h('div', {style:{flex:'none',fontSize:'20px',lineHeight:'1',opacity:'.85',transition:'transform .18s',transform:open?'rotate(90deg)':'rotate(0deg)'}}, '▸') : null
    );
    const orderedDayEx = d.ex.slice().sort((a,b) => GROUPS.indexOf(EX[a].g) - GROUPS.indexOf(EX[b].g));
    const exList = (open && has) ? h('div', {style:{padding:'4px 12px 14px 33px'}},
      h('div', {style:{paddingLeft:'16px'}},
        orderedDayEx.map((id,xi) => {
          const newGroup = xi > 0 && EX[id].g !== EX[orderedDayEx[xi-1]].g;   // thin line where muscle group changes
          return h('div', {style:{position:'relative',display:'flex',alignItems:'center',justifyContent:'space-between',gap:'10px',padding:'8px 0',borderTop:(newGroup?'1px solid rgba(255,255,255,.18)':'none')}},
            h('div', {style:{position:'absolute',left:'-16px',top:'50%',transform:'translateY(-50%)',width:'6px',height:'6px',borderRadius:'999px',background:'rgba(255,255,255,.75)'}}),
            h('div', {style:{flex:'1',minWidth:'0',fontSize:'14px',fontWeight:'600',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}, EX[id].n),
            h('div', {style:{flex:'none',fontSize:'11px',fontWeight:'700',opacity:'.95',background:'rgba(255,255,255,.16)',borderRadius:'12px',padding:'3px 10px'}}, EX[id].sets + ' sets')
          );
        })
      )
    ) : null;
    return h('div', {style:{borderBottom:(i<S.week.length-1?'1px solid rgba(255,255,255,.16)':'none')}}, header, exList);
  });

  const weekWell = h('div', {style:{background:'rgba(0,0,0,.14)',borderRadius:'14px',padding:'4px 12px 6px',marginTop:'4px',boxShadow:'inset 0 2px 6px rgba(0,0,0,.22)'}},
    ...splitRows
  );

  const activeCard = h('div', {style:{background:'var(--color-accent)',color:'var(--color-bg)',borderRadius:'var(--radius-lg)',padding:'20px',boxShadow:'0 14px 30px -6px color-mix(in srgb, var(--color-accent) 55%, transparent), 0 4px 10px rgba(0,0,0,.18)',marginBottom:'22px'}},
    h('div', {style:{fontSize:'11px',letterSpacing:'0',opacity:'.8',fontWeight:'700'}}, 'Active split'),
    h('div', {style:{fontFamily:'var(--font-heading)',fontSize:'27px',margin:'4px 0 16px'}}, plan.name),
    h('div', {style:{fontSize:'11px',letterSpacing:'0',fontWeight:'700',opacity:'.7',marginBottom:'2px'}}, 'Your week'),
    weekWell,
    h('button', {style:{width:'100%',marginTop:'16px',border:'none',cursor:'pointer',background:'var(--color-bg)',color:'var(--color-accent-800)',borderRadius:'12px',padding:'14px',fontFamily:'var(--font-heading)',fontSize:'15px',boxShadow:'0 3px 8px rgba(0,0,0,.18)'}, hover:{background:'var(--color-accent-100)'}, onClick:() => setState({overlay:'builder', day:firstTrain(), dayPick:null})}, 'Customise split')
  );

  const changeBtn = h('button', {style:{width:'100%',border:'1px solid var(--color-divider)',cursor:'pointer',background:'var(--color-surface)',color:'var(--color-text)',borderRadius:'12px',padding:'15px',fontFamily:'var(--font-heading)',fontSize:'15px',boxShadow:'var(--shadow-sm)'}, hover:{background:'color-mix(in srgb, var(--color-text) 6%, transparent)'}, onClick:() => setState({overlay:'plans'})}, 'Change split');
  const createBtn = h('button', {style:{width:'100%',marginTop:'10px',border:'none',cursor:'pointer',background:'var(--color-text)',color:'var(--color-bg)',borderRadius:'12px',padding:'15px',fontFamily:'var(--font-heading)',fontSize:'15px',boxShadow:'var(--shadow-sm)'}, hover:{background:'color-mix(in srgb, var(--color-text) 85%, #fff)'}, onClick:createPlan}, 'Create split');

  return h('div', {style:{padding:'6px 22px 152px'}},
    h('h2', {style:{fontFamily:'var(--font-heading)',fontSize:'30px',margin:'0 0 16px'}}, 'Your split'),
    activeCard,
    changeBtn,
    createBtn
  );
}

// Bottom sheet: pick a different ready-made plan. Opened from Plans → "Change plan".
function viewPlanPicker(){
  const presets = Object.keys(PLANS).map(id => {
    const p = PLANS[id];
    const inUse = id === S.planId;
    return h('div', {style:{background:'var(--color-surface)',borderRadius:'var(--radius-md)',padding:'16px 16px 14px',marginBottom:'12px',boxShadow:'var(--shadow-sm)',border:'2px solid '+(inUse?'var(--color-accent)':'transparent')}},
      h('div', {style:{flex:'1'}},
        h('div', {style:{fontFamily:'var(--font-heading)',fontSize:'19px'}}, p.name),
        h('div', {style:{fontSize:'12px',color:'var(--color-neutral-700)',marginTop:'3px'}}, p.blurb)
      ),
      h('div', {style:{display:'flex',alignItems:'center',justifyContent:'space-between',gap:'8px',marginTop:'14px'}},
        h('div', {style:{flex:'1',minWidth:'0',fontSize:'12px',color:'var(--color-neutral-600)',fontWeight:'600'}}, p.days),
        h('button', {title:'Use & edit in the builder', style:{flex:'none',border:'1px solid var(--color-divider)',background:'transparent',color:'var(--color-text)',cursor:'pointer',borderRadius:'12px',padding:'8px 14px',fontFamily:'var(--font-heading)',fontSize:'13px',whiteSpace:'nowrap'}, hover:{background:'color-mix(in srgb, var(--color-text) 6%, transparent)'}, onClick:() => { if (!inUse) usePlan(id); setState({overlay:'builder', day:firstTrain(), dayPick:null}); }}, 'Customise'),
        h('button', {style:{flex:'none',border:(inUse?'1px solid var(--color-divider)':'none'),background:(inUse?'transparent':'var(--color-accent)'),color:(inUse?'var(--color-neutral-600)':'var(--color-bg)'),cursor:(inUse?'default':'pointer'),borderRadius:'12px',padding:'8px 16px',fontFamily:'var(--font-heading)',fontSize:'13px',whiteSpace:'nowrap'}, hover:(inUse?null:primaryHover), onClick:() => { if (!inUse){ usePlan(id); setState({overlay:null}); } }}, inUse ? 'In use' : 'Use')
      )
    );
  });
  const panel = h('div', {class:'sx', style:{width:'100%',background:'var(--color-bg)',borderTopLeftRadius:'var(--radius-lg)',borderTopRightRadius:'var(--radius-lg)',padding:'14px 22px 34px',maxHeight:'86%',overflowY:'auto'},
      onClick:(ev) => ev.stopPropagation()},
    h('div', {style:{width:'44px',height:'5px',borderRadius:'999px',background:'var(--color-neutral-400)',margin:'0 auto 16px'}}),
    h('h3', {style:{fontFamily:'var(--font-heading)',fontSize:'24px',margin:'0 0 4px'}}, 'Templates'),
    h('p', {style:{fontSize:'13px',color:'var(--color-neutral-700)',margin:'0 0 16px'}}, 'Pick one and it fills your week. You can swap any exercise after.'),
    ...presets
  );
  return h('div', {style:{position:'absolute',inset:'0',background:'rgba(32,30,29,.45)',display:'flex',alignItems:'flex-end',zIndex:'80'},
      onClick:() => setState({overlay:null})}, panel);
}

// Your own avatar: profile photo (data URL) if set, else the accent initial circle.
function selfAvatar(size){
  if (S.pfp) return h('div', {style:{width:size+'px',height:size+'px',flex:'none',borderRadius:'999px',background:'center/cover no-repeat url('+S.pfp+')',backgroundSize:'cover'}});
  return h('div', {style:{width:size+'px',height:size+'px',flex:'none',borderRadius:'999px',background:'var(--color-accent)',color:'var(--color-bg)',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'var(--font-heading)',fontSize:Math.round(size*0.42)+'px'}}, (S.uname||'?').slice(0,1).toUpperCase());
}

/* ── Friends (social) ── */
// Round avatar with initials, tinted to the friend's accent.
function avatar(fr, size){
  return h('div', {style:{width:size+'px',height:size+'px',flex:'none',borderRadius:'999px',background:fr.accent,color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'var(--font-heading)',fontSize:Math.round(size*0.4)+'px',letterSpacing:'.02em'}}, fr.initials);
}
function viewFriends(){
  if (!S.social){ loadSocial(); return h('div', {style:{padding:'70px 22px'}},
    h('h2', {style:{fontFamily:'var(--font-heading)',fontSize:'30px',margin:'0 0 16px'}}, 'Friends'),
    h('div', {style:{fontSize:'14px',color:'var(--color-neutral-600)'}}, 'Loading…')); }

  const friends = S.social.friends;
  // Sessions where you attached a photo become shared posts (userId 'me') - friends see them in the feed.
  const meFeed = (S.log||[]).filter(r => r.sets && r.sets.length && r.photo).map(r => ({id:'me_'+r.date, userId:'me', date:r.date, name:r.name.replace(/ day$/,''), vol:r.vol, mins:r.mins, sets:r.sets, photo:r.photo}));
  const _cut = new Date(); _cut.setHours(0,0,0,0); _cut.setDate(_cut.getDate()-4);   // posts expire after 4 days
  const feed = [...meFeed, ...S.social.feed].filter(a => parseYmd(a.date) >= _cut).sort((a,b) => parseYmd(b.date) - parseYmd(a.date));

  // Friend strip - tap an avatar to open their profile.
  const strip = h('div', {class:'sx', style:{display:'flex',gap:'14px',overflowX:'auto',padding:'2px 2px 8px',marginBottom:'18px'}},
    friends.map(fr => { const live = isLive(fr); return h('button', {style:{flex:'none',display:'flex',flexDirection:'column',alignItems:'center',gap:'6px',width:'64px',border:'none',background:'transparent',cursor:'pointer',padding:'0'}, onClick:() => setState({friendProfile:fr.id})},
      h('div', {style:{position:'relative',height:'58px',display:'flex',alignItems:'center',justifyContent:'center'}},
        // Live (mid-workout) → pulsing green ring around the avatar.
        live
          ? h('div', {class:'live-ring', style:{borderRadius:'999px',padding:'3px',background:'#22af5a'}}, h('div', {style:{borderRadius:'999px',padding:'2px',background:'var(--color-bg)'}}, avatar(fr, 48)))
          : avatar(fr, 54),
        live
          ? h('div', {class:'live-dot', style:{position:'absolute',right:'0',bottom:'0',width:'15px',height:'15px',borderRadius:'999px',background:'#22af5a',border:'2px solid var(--color-bg)'}})
          : (fr.thisWeek >= fr.weekGoal ? h('div', {style:{position:'absolute',right:'-2px',bottom:'-2px',width:'20px',height:'20px',borderRadius:'999px',background:'var(--color-accent)',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'11px',border:'2px solid var(--color-bg)'}}, '✓') : null),
        fr.streak > 0 ? h('div', {style:{position:'absolute',right:'-9px',top:'-7px',lineHeight:'0',filter:'drop-shadow(0 1px 2px rgba(0,0,0,.3))'}}, streakBadge(28, fr.streak)) : null
      ),
      h('div', {style:{fontSize:'11px',fontWeight:'600',color:'var(--color-neutral-700)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',maxWidth:'64px'}}, fr.name.split(' ')[0])
    ); })
  );

  // Activity feed - a card per finished session.
  const feedCards = feed.map(a => {
    const isMe = a.userId === 'me';
    const fr = isMe ? null : (friendById(a.userId) || {name:'?',initials:'?',accent:'#888'});
    const who = isMe ? (S.uname + ' (You)') : fr.name;
    const avatarNode = isMe ? selfAvatar(40) : avatar(fr, 40);
    const open = isMe ? () => setState({dayDetail:a.date}) : () => setState({friendProfile:a.userId});
    const header = h('div', {style:{display:'flex',alignItems:'center',gap:'11px',marginBottom:'10px'}},
      avatarNode,
      h('div', {style:{flex:'1',minWidth:'0',fontSize:'14px',fontWeight:'700',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}, who),
      h('div', {style:{flex:'none',fontSize:'11px',color:'var(--color-neutral-500)',fontWeight:'600'}}, timeAgo(a.date))
    );
    const cta = (label) => h('button', {style:{width:'100%',border:'1px solid var(--color-divider)',cursor:'pointer',background:'transparent',color:'var(--color-text)',borderRadius:'12px',padding:'11px',fontFamily:'var(--font-heading)',fontSize:'14px'}, hover:{background:'color-mix(in srgb, var(--color-text) 6%, transparent)'}, onClick:open}, label);

    if (a.photo){
      // Photo post - big image, workout name overlaid, tap "See workout" for the detail.
      return h('div', {style:{background:'var(--color-surface)',borderRadius:'var(--radius-md)',boxShadow:'var(--shadow-sm)',padding:'14px 16px',marginBottom:'12px'}},
        header,
        h('div', {style:{position:'relative',borderRadius:'12px',overflow:'hidden',marginBottom:'12px',background:'#000'}},
          h('img', {src:a.photo, style:{display:'block',width:'100%',height:'auto'}}),
          h('div', {style:{position:'absolute',left:'0',right:'0',bottom:'0',height:'88px',background:'linear-gradient(transparent, rgba(0,0,0,.72))'}}),
          h('div', {style:{position:'absolute',left:'14px',bottom:'12px',right:'14px'}},
            h('div', {style:{fontFamily:'var(--font-heading)',fontSize:'24px',color:'#fff',lineHeight:'1.05'}}, a.name),
            h('div', {style:{fontSize:'11px',color:'rgba(255,255,255,.85)',fontWeight:'600',marginTop:'2px'}}, a.mins + ' min · ' + Math.round(a.vol) + ' kg')
          )
        ),
        cta('See workout')
      );
    }

    // No photo - short preview (name + first 2 lifts) with an Expand.
    const preview = a.sets.slice(0,2).map((s,i) => {
      return h('div', {style:{display:'flex',alignItems:'center',gap:'10px',padding:'6px 0'}},
        h('div', {style:{width:'16px',flex:'none',textAlign:'center',fontFamily:'var(--font-heading)',fontSize:'14px',color:'var(--color-neutral-500)'}}, i+1),

function viewProgress(){

    cells.push(h('div', {...(done?{class:'tap'}:{}), style:{position:'relative',aspectRatio:'1',borderRadius:'8px',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'12px',fontWeight:'700',fontVariantNumeric:'tabular-nums',cursor:done?'pointer':'default',

    h('div', {style:{display:'flex',alignItems:'center',justifyContent:'space-between'}},
      h('div', {style:{fontFamily:'var(--font-heading)',fontSize:'18px'}}, 'Consistency'),

        h('button', {title:'Previous month', style:{width:'38px',height:'38px',flex:'none',display:'flex',alignItems:'center',justifyContent:'center',borderRadius:'999px',border:'1px solid var(--color-divider)',background:'transparent',cursor:'pointer',color:'var(--color-text)',padding:'0'}, hover:{background:'color-mix(in srgb, var(--color-text) 7%, transparent)'}, onClick:() => setState({calMonth:calOff-1})},
          svg({width:'17',height:'17',viewBox:'0 0 24 24',fill:'none',stroke:'currentColor','stroke-width':'2.4','stroke-linecap':'round','stroke-linejoin':'round'}, '<path d="M15 5l-7 7 7 7"/>')),

    top3.length ? top3.map((o,i) => h('div', {style:{display:'flex',alignItems:'center',gap:'12px',padding:'10px 0',borderBottom:(i<top3.length-1?'1px solid var(--color-divider)':'none')}},
      h('div', {style:{width:'26px',height:'26px',flex:'none',borderRadius:'999px',background:medal[i],color:'var(--color-bg)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'12px',fontWeight:'700'}}, i+1),
      h('div', {style:{flex:'1',minWidth:'0'}},

    )) : h('div', {style:{fontSize:'14px',color:'var(--color-neutral-600)',padding:'6px 0'}}, 'Log a couple of sessions to see your gains.')
  );

  // muscle balance - real logged sets over the last 30 days (falls back to plan estimate if nothing logged yet)
  const setsBy = {}; GROUPS.forEach(g => setsBy[g] = 0);
  const cutoff = new Date(); cutoff.setHours(0,0,0,0); cutoff.setDate(cutoff.getDate()-30);
  let logged = 0;
  (S.log||[]).forEach(r => { if (parseYmd(r.date) >= cutoff) r.sets.forEach(s => { if (s.g in setsBy){ setsBy[s.g]++; logged++; } }); });
  if (!logged) S.week.forEach(d => d.ex.forEach(id => setsBy[EX[id].g] += EX[id].sets * 4));

      );
    })
  );

  return h('div', {style:{padding:'6px 22px 152px'}},
    h('h2', {style:{fontFamily:'var(--font-heading)',fontSize:'30px',margin:'0 0 16px'}}, 'Progress'),
    consistency, chartCard, balCard
  );
}

function viewGroupPanel(){
  if (!S.groupPanel || !S.group) return null;
  const myHidden = S.group.casual !== false;             // casual is the norm; you compete only when opted in
  const all = S.group.memberIds.map(memberStat);
  // Others can't see a hidden you, so you leave the ranking; the rest still compete.
  const ranked = all.filter(s => !(s.isMe && myHidden)).sort((a,b) => b.vol - a.vol);
  const hiddenMe = all.filter(s => s.isMe && myHidden);
  const ordered = ranked.concat(hiddenMe);               // hidden-you sits at the bottom, unranked
  const rankOf = new Map(); ranked.forEach((s,vi) => rankOf.set(s.id, vi));
  const rows = ordered.map((s) => {
    const vi = rankOf.has(s.id) ? rankOf.get(s.id) : -1;

    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});

// Read a picked image file, downscale to ≤256px, hand back a JPEG data URL.
function readPhoto(file, cb){
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 1080, scale = Math.min(1, max/Math.max(img.width, img.height));
      const w = Math.round(img.width*scale), hgt = Math.round(img.height*scale);
      const c = document.createElement('canvas'); c.width = w; c.height = hgt;
      const cx = c.getContext('2d'); cx.imageSmoothingQuality = 'high'; cx.drawImage(img, 0, 0, w, hgt);
      cb(c.toDataURL('image/jpeg', 0.85));
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
}

// In-app camera: live preview + flash (torch), zoom, shutter, retake/use. Lives outside render().
function openCamera(){
  const md = navigator.mediaDevices;
  if (!md || !md.getUserMedia){ pickPhotoFallback(); return; }
  let stream = null, track = null, hwZoom = false, zoom = 1, facing = 'user';   // open to selfie mode

  const video = h('video', {autoplay:'', playsinline:'', style:{position:'absolute',inset:'0',width:'100%',height:'100%',objectFit:'contain',transformOrigin:'center center'}});
  video.muted = true; video.playsInline = true;

    else video.style.transform = 'scale('+(mx*effZoom())+','+effZoom()+')';
    zoomBtns.forEach((b,i) => { const on = zoomLevels[i] === zoom; b.style.background = on ? '#fff' : 'rgba(255,255,255,.18)'; b.style.color = on ? '#000' : '#fff'; });
  };

  const cleanup = () => { if (stream) stream.getTracks().forEach(t => t.stop()); if (overlay.parentNode) document.body.removeChild(overlay); };

    const scale = Math.min(1, 1080/Math.max(sw, sh)), cw = Math.round(sw*scale), ch = Math.round(sh*scale);

  }

  function startStream(firstTime){

    hwZoom = false; zoom = 1;
    md.getUserMedia({video:{facingMode:{ideal:facing}, width:{ideal:1920}, height:{ideal:1080}}, audio:false})

  }

// Main tab order (matches the tab bar). Drives the swipe pager.
const TAB_ORDER = ['progress','plans','today','friends','settings'];
function viewFor(tab){
  return tab === 'plans' ? viewPlans() : tab === 'friends' ? viewFriends() : tab === 'progress' ? viewProgress() : tab === 'settings' ? viewSettings() : viewToday();
}
const _scrollByTab = {};   // remember each tab's vertical scroll across re-renders

// Snapchat-style pager: three panels (prev · current · next) on a flex track offset to
// show the middle. A horizontal drag moves the track with the finger; release snaps to a
// neighbour (then commits the tab) or springs back. Vertical drags fall through to scroll.
function buildPager(){
  const ci = Math.max(0, TAB_ORDER.indexOf(S.tab));
  const prevTab = ci > 0 ? TAB_ORDER[ci-1] : null;
  const nextTab = ci < TAB_ORDER.length-1 ? TAB_ORDER[ci+1] : null;
  const panel = (tab) => h('div', {class:'sx', style:{flex:'0 0 100%',height:'100%',overflowY:'auto',overflowX:'hidden'}}, tab ? viewFor(tab) : null);
  const pPrev = panel(prevTab), pCur = panel(S.tab), pNext = panel(nextTab);
  const track = h('div', {style:{display:'flex',height:'100%',transform:'translateX(-100%)',willChange:'transform'}}, pPrev, pCur, pNext);
  const viewport = h('div', {style:{flex:'1',position:'relative',overflow:'hidden',touchAction:'pan-y'}}, track);

  // restore scroll positions
  [[prevTab,pPrev],[S.tab,pCur],[nextTab,pNext]].forEach(([t,p]) => { if (t) p.scrollTop = _scrollByTab[t] || 0; });
  pCur.addEventListener('scroll', () => { _scrollByTab[S.tab] = pCur.scrollTop; });
  phone._scroll = pCur;

  let sx = 0, sy = 0, axis = null, down = false, w = 0, committing = false;
  viewport.addEventListener('pointerdown', (e) => {
    if (committing || S.overlay || S.sheet || S.dayDetail || S.friendProfile) return;
    // let an inner horizontal scroller (friend strip, chips) keep the gesture
    for (let n = e.target; n && n !== viewport; n = n.parentElement){
      if (n !== pPrev && n !== pCur && n !== pNext && n.scrollWidth > n.clientWidth + 4 && /auto|scroll/.test(getComputedStyle(n).overflowX)) return;
    }
    down = true; axis = null; sx = e.clientX; sy = e.clientY; w = viewport.clientWidth || 1;
    track.style.transition = 'none';
  });
  viewport.addEventListener('pointermove', (e) => {
    if (!down) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (axis === null){
      if (Math.abs(dx) > 12 || Math.abs(dy) > 10){ axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y'; }   // no pointer capture - lets a tap fall through to the cell
    }
    if (axis !== 'x') return;
    e.preventDefault();
    let d = dx;
    if ((d > 0 && !prevTab) || (d < 0 && !nextTab)) d *= 0.28;   // rubber-band at the ends
    track.style.transform = 'translateX(calc(-100% + ' + d + 'px))';
  });
  const finish = (e) => {
    if (!down) return; down = false;
    if (axis !== 'x') return;
    const dx = e.clientX - sx;
    const thr = Math.min(85, w * 0.26);
    let target = null, to = '-100%';
    if (dx <= -thr && nextTab){ target = nextTab; to = '-200%'; }
    else if (dx >= thr && prevTab){ target = prevTab; to = '0%'; }
    track.style.transition = 'transform .26s cubic-bezier(.22,.61,.36,1)';
    track.style.transform = 'translateX(' + to + ')';
    if (target){ committing = true; setTimeout(() => { setState({tab:target, overlay:null}); if (target === 'friends') loadSocial(); }, 250); }
  };
  viewport.addEventListener('pointerup', finish);
  viewport.addEventListener('pointercancel', () => { if (down){ down = false; track.style.transition = 'transform .2s'; track.style.transform = 'translateX(-100%)'; } });
  return viewport;
}

};
function tabIcon(id){
  return svg({width:'23',height:'23',viewBox:'0 0 24 24',fill:'none',stroke:'currentColor','stroke-width':'2','stroke-linecap':'round','stroke-linejoin':'round'}, TAB_ICONS[id]);
}
function tabBar(){
  const tabs = [['progress','Progress'],['plans','Split'],['today','Today'],['friends','Friends'],['settings','Settings']];
  return h('div', {style:{position:'absolute',left:'0',right:'0',bottom:'0',paddingBottom:'calc(env(safe-area-inset-bottom) + 10px)',paddingTop:'10px',background:'var(--color-surface)',borderTop:'1px solid var(--color-divider)',display:'flex',zIndex:'30'}},
    tabs.map(([id,name]) => {
      const on = S.tab === id;
      return h('button', {style:{flex:'1',cursor:'pointer',border:'none',background:'transparent',color:(on?'var(--color-text)':'var(--color-neutral-500)'),padding:'2px 0 0',display:'flex',flexDirection:'column',alignItems:'center',gap:'5px',fontFamily:'var(--font-body)',fontSize:'10px',fontWeight:'600',letterSpacing:'0'}, onClick:() => { setState({tab:id, overlay:null}); if (id === 'friends') loadSocial(); }},
        h('div', {style:{padding:'6px 18px',borderRadius:'999px',background:(on?'var(--color-accent)':'transparent'),color:(on?'#fff':'inherit'),display:'flex',alignItems:'center',justifyContent:'center',transition:'background .15s'}}, tabIcon(id)),
        h('span', {}, name)
      );
    })
  );
}

/* ══════════════════════════════════════════════════════════════
   Render
   ══════════════════════════════════════════════════════════════ */
const phone = document.getElementById('phone');
function render(){
  const pager = buildPager();

  const app = h('div', {style:{height:'100%',display:'flex',flexDirection:'column',background:'var(--color-bg)',fontFamily:'var(--font-body)',color:'var(--color-text)',position:'relative',overflow:'hidden'}},
    header(),
    pager,
    tabBar(),
    S.overlay === 'builder' && viewBuilder(),
    S.overlay === 'workout' && viewWorkout(),
    S.overlay === 'workout' && viewWorkoutPick(),
    S.overlay === 'workout' && viewGroupPanel(),
    S.overlay === 'plans' && viewPlanPicker(),
    viewSheet(),
    viewDayDetail(),
    viewFriendProfile(),
    viewFriendPlan(),
    viewInviteCompose(),
    viewEditProfile(),
    viewSplitPrompt(),
    viewWorkoutBubble(),
    viewConfirm()
  );

  phone.innerHTML = '';
  phone.append(app);

  // The tapped day grows fast and "jumps" into the middle of the screen, blooming into the card.
  if (S.dayDetail && S.dayFrom){
    const sheet = document.getElementById('daySheet'), backdrop = document.getElementById('daySheetBackdrop');
    if (sheet){
      const r = sheet.getBoundingClientRect();
      const cx = r.left + r.width/2, cy = r.top + r.height/2;   // card centre (screen)
      const dx = S.dayFrom.x - cx, dy = S.dayFrom.y - cy;       // offset from centre to tapped icon
      sheet.animate([
        {transform:'translate('+dx+'px,'+dy+'px) scale(.12)', opacity:0,   offset:0},
        {transform:'translate('+(dx*0.12)+'px,'+(dy*0.12)+'px) scale(1.08)', opacity:1, offset:0.75},
        {transform:'translate(0,0) scale(1)', opacity:1, offset:1}
      ], {duration:420, easing:'cubic-bezier(.34,1.4,.5,1)'});
      if (backdrop) backdrop.animate([{opacity:0},{opacity:1}], {duration:200, easing:'ease-out'});
    }
    S.dayFrom = null;   // don't replay on later re-renders while the card stays open
  }

  // Just-finished workout: the check stamps into that day's holster (drops in big → smacks → settles).
  if (S.slapDay){
    const el = document.getElementById('strip-sticker-'+S.slapDay);
    if (el){
      el.animate([
        {transform:'translateY(-10px) scale(1.9)', opacity:0, offset:0},
        {transform:'translateY(0) scale(.84)',     opacity:1, offset:.30},   // impact squash
        {transform:'scale(1.1)', offset:.5},
        {transform:'scale(.97)', offset:.7},
        {transform:'scale(1)',   offset:1}
      ], {duration:520, easing:'cubic-bezier(.3,1.2,.5,1)'});
    }
    S.slapDay = null;
  }

  // Exercise dragged into the workout bar: bring it into view (no pop).
  if (S.wAddedIdx != null){
    const el = document.getElementById('wbubble-'+S.wAddedIdx);
    if (el) el.scrollIntoView({inline:'end', block:'nearest'});
    S.wAddedIdx = null;
  }
}

// A full render swaps every node, so one landing mid-press destroys the button the finger
// is on and the click never fires (this is what broke "Join the competition"). Never
// repaint while a pointer is down.
let touching = false;
document.addEventListener('pointerdown', () => { touching = true; }, true);
document.addEventListener('pointerup', () => { touching = false; }, true);
document.addEventListener('pointercancel', () => { touching = false; }, true);

// Rest timer / elapsed clock tick. During REST, repaint for the countdown ring; during
// active logging, only patch the elapsed-clock text so constant re-renders don't eat taps.
setInterval(() => {
  const w = S.w; if (!w || scrubbing || touching) return;
  // Minimised: the overlay is gone, so only the bubble's two lines need refreshing.
  // Critically, no full render here - the rest of the app has to stay tappable.
  if (S.overlay !== 'workout'){
    if (w.done) return;
    const L = bubbleLines();
    const bt = document.getElementById('wbTitle'); if (bt) bt.textContent = L.title;
    const bs = document.getElementById('wbSub');   if (bs) bs.textContent = L.sub;
    return;
  }
  // Leaderboard sheet is open: friends' progress advances → full repaint (no text inputs on top).
  if (S.group && S.groupPanel){ render(); return; }
  if (w.resting){ render(); return; }
  if (!w.done){
    const el = document.getElementById('wClock'); if (el){ const e = Math.floor((Date.now() - w.start)/1000); el.textContent = Math.floor(e/60) + ':' + String(e%60).padStart(2,'0') + ' elapsed'; }
    if (w.cardioRunning){ const cc = document.getElementById('cardioClock'); if (cc) cc.textContent = fmtDur(cardioSecs(w)); }
    // Keep the squad bar's leader line live without a full re-render (would eat taps).
    if (S.group){ const gl = document.getElementById('gLeader'); if (gl) gl.textContent = groupLeaderLabel(); }
  }
}, 250);

applyPrefs();
render();
</script>
</body>
</html>
