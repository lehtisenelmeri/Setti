<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Setti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ── Organic design-system tokens (from _ds/organic .../styles.css) ── */
  :root {
    --color-bg: #F4F3F0;
    --color-surface: #FFFFFF;
    --color-surface-2: #F7F6F3;
    --color-text: #16151A;
    --color-divider: rgba(22,21,26,.08);

    --color-neutral-100: #F5F4F2;
    --color-neutral-200: #EAE8E4;
    --color-neutral-300: #DAD7D1;
    --color-neutral-400: #BEBAB2;
    --color-neutral-500: #9B968D;
    --color-neutral-600: #787369;
    --color-neutral-700: #575249;
    --color-neutral-800: #3A3630;
    --color-neutral-900: #16151A;

    --font-heading: "Plus Jakarta Sans", system-ui, sans-serif;
    --font-body: "Figtree", system-ui, sans-serif;

    --radius-sm: 12px;
    --radius-md: 18px;
    --radius-lg: 26px;

    --shadow-sm: 0 1px 2px rgba(22,21,26,.05);
    --shadow-md: 0 4px 16px -6px rgba(22,21,26,.13);
    --shadow-lg: 0 14px 34px -12px rgba(22,21,26,.18);
  }

  /* Accent seed ramps live on <body> so palette classes (also on <body>) and
     the numbered mapping below resolve against the SAME element - a var() in a
     :root-declared property would resolve the seed on :root, ignoring the swap. */
  body {
    --a1:#ffe9e2; --a2:#ffcabb; --a3:#ffa88f; --a4:#ff8563; --a5:#fb6440; --a6:#ee4c27; --a7:#c53c1c; --a8:#8f2b14; --a9:#5a1a0c; --a-base:#FB5A34;
    --b1:#e7ecff; --b2:#c6d3ff; --b3:#9cb2ff; --b4:#6b8bff; --b5:#4468ff; --b6:#2b5bff; --b7:#1f45cc; --b8:#163199; --b9:#0e1f66; --b-base:#2B5BFF;

    --color-accent: var(--a-base);
    --color-accent-2: var(--b-base);
    --color-accent-100: var(--a1); --color-accent-200: var(--a2); --color-accent-300: var(--a3); --color-accent-400: var(--a4); --color-accent-500: var(--a5); --color-accent-600: var(--a6); --color-accent-700: var(--a7); --color-accent-800: var(--a8); --color-accent-900: var(--a9);
    --color-accent-2-100: var(--b1); --color-accent-2-200: var(--b2); --color-accent-2-300: var(--b3); --color-accent-2-400: var(--b4); --color-accent-2-500: var(--b5); --color-accent-2-600: var(--b6); --color-accent-2-700: var(--b7); --color-accent-2-800: var(--b8); --color-accent-2-900: var(--b9);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* every heading uses var(--font-heading) inline - chunky extrabold display */
  [style*="--font-heading"] { font-weight: 800; letter-spacing: -0.03em; }
  html, body { margin: 0; }
  body {
    font-family: var(--font-body);
    color: var(--color-text);
    letter-spacing: -0.006em;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background:
      radial-gradient(120% 80% at 50% -10%, #f7f6f3, #eceae6 70%),
      #eceae6;
  }
  button { transition: transform .12s cubic-bezier(.2,.8,.2,1), opacity .12s ease, filter .12s ease; }
  button:active { transform: scale(.97); }
  a { color: var(--color-accent); }
  a:hover { color: var(--color-accent-700); }
  .sx::-webkit-scrollbar { display: none; }
  .sx { scrollbar-width: none; }

  /* ── phone frame ── */
  .phone {
    width: 402px;
    height: 874px;
    max-height: calc(100vh - 48px);
    border-radius: 48px;
    overflow: hidden;
    position: relative;
    background: var(--color-bg);
    box-shadow: 0 40px 80px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.12);
    -webkit-font-smoothing: antialiased;
  }
  .island {
    position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
    width: 126px; height: 37px; border-radius: 24px; background: #000; z-index: 50;
  }
  .statusbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 40;
    display: flex; align-items: center; justify-content: space-between;
    padding: 19px 30px 0; pointer-events: none;
  }
  .statusbar .time {
    font-family: -apple-system, "SF Pro", system-ui; font-weight: 600;
    font-size: 15px; color: var(--color-text);
  }
  .homebar {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 60;
    height: 30px; display: flex; justify-content: center; align-items: flex-end;
    padding-bottom: 8px; pointer-events: none;
  }
  .homebar > div {
    width: 139px; height: 5px; border-radius: 100px;
    background: color-mix(in srgb, var(--color-text) 30%, transparent);
  }
  button { font-family: inherit; }

  /* ── accent palettes - vivid & sporty; each swaps the accent ramp only
     (Coral is the un-classed base seed on <body>; secondary stays blue) ── */
  body.pal-blue {
    --a1:#e7ecff; --a2:#c6d6ff; --a3:#98b6ff; --a4:#648fff; --a5:#3d70ff; --a6:#2b6bff; --a7:#1f50cc; --a8:#163a99; --a9:#0e2666; --a-base:#2B6BFF;
  }
  body.pal-violet {
    --a1:#ece7fe; --a2:#d5c9fc; --a3:#b39ff8; --a4:#8f6ff1; --a5:#7854ea; --a6:#6842d6; --a7:#5233ab; --a8:#3b2580; --a9:#261754; --a-base:#6C4DF5;
  }
  body.pal-magenta {
    --a1:#ffe4f0; --a2:#ffc0dd; --a3:#ff8bbe; --a4:#fb5b9f; --a5:#ef3d87; --a6:#d62d72; --a7:#ab2359; --a8:#7d1940; --a9:#4f1029; --a-base:#F5388A;
  }
  body.pal-teal {
    --a1:#d6f4f6; --a2:#a6e8ec; --a3:#63d5dc; --a4:#22bfc9; --a5:#0aa6b1; --a6:#088e99; --a7:#076f78; --a8:#054e55; --a9:#033136; --a-base:#08AEB8;
  }
  body.pal-green {
    --a1:#ddf6e4; --a2:#b4ebc4; --a3:#79d795; --a4:#40c169; --a5:#22a94e; --a6:#1c8f43; --a7:#167034; --a8:#0f5025; --a9:#093216; --a-base:#1EA84D;
  }

  /* ── dark theme: bg/surface/text flip, tonal ramps invert so every
     "accent-200 bg + accent-800 text" pair stays readable on dark ── */
  body.dark {
    --color-bg: #100F12;
    --color-surface: #1B1A1F;
    --color-surface-2: #232228;
    --color-text: #F4F3F0;
    --color-divider: color-mix(in srgb, #f4f3f0 10%, transparent);

    /* darker, muted accent so big bands don't glare on the dark ground */
    --color-accent: color-mix(in srgb, var(--a-base) 80%, #000);
    --color-accent-2: color-mix(in srgb, var(--b-base) 80%, #000);

    --color-neutral-100: #1B1A1F;
    --color-neutral-200: #232228;
    --color-neutral-300: #333138;
    --color-neutral-400: #4a4750;
    --color-neutral-500: #6f6b76;
    --color-neutral-600: #928d99;
    --color-neutral-700: #bbb6c1;
    --color-neutral-800: #d9d5dd;
    --color-neutral-900: #F4F3F0;

    /* invert the seed ramp step-for-step, works for any palette */
    --color-accent-100: var(--a9); --color-accent-200: var(--a8); --color-accent-300: var(--a7); --color-accent-400: var(--a6); --color-accent-500: var(--a5); --color-accent-600: var(--a4); --color-accent-700: var(--a3); --color-accent-800: var(--a2); --color-accent-900: var(--a1);
    --color-accent-2-100: var(--b9); --color-accent-2-200: var(--b8); --color-accent-2-300: var(--b7); --color-accent-2-400: var(--b6); --color-accent-2-500: var(--b5); --color-accent-2-600: var(--b4); --color-accent-2-700: var(--b3); --color-accent-2-800: var(--b2); --color-accent-2-900: var(--b1);

    --shadow-sm: 0 1px 2px rgba(0,0,0,.5);
    --shadow-md: 0 3px 12px rgba(0,0,0,.55);
    --shadow-lg: 0 14px 34px rgba(0,0,0,.6);
    background: #14110f;
  }
  body.dark .phone { box-shadow: 0 40px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.06); }

  @media (max-width: 640px) {
    html, body { height: 100%; }
    body { padding: 0; background: var(--color-bg); display: block; }
    .phone {
      width: 100vw; height: 100vh; height: 100dvh; max-height: none;
      border-radius: 0; box-shadow: none;
    }
    .island { display: none; }
  }
  /* "at the gym" live pulse for friend avatars */
  @keyframes livePulse {
    0%   { box-shadow: 0 0 0 0 rgba(34,175,90,.55); }
    70%  { box-shadow: 0 0 0 8px rgba(34,175,90,0); }
    100% { box-shadow: 0 0 0 0 rgba(34,175,90,0); }
  }
  .live-ring { animation: livePulse 1.8s ease-out infinite; }
  .live-dot  { animation: livePulse 1.8s ease-out infinite; }
  /* week-strip completion stamp: solid check drops into the holster on finish */
  @keyframes stampIn {
    0%   { opacity: 0; transform: translateY(-10px) scale(1.9); }
    26%  { opacity: 1; transform: translateY(0) scale(.84); }   /* impact squash */
    42%  { transform: scale(1.1); }
    62%  { transform: scale(.97); }
    100% { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>
<div class="phone" id="phone"></div>

<script>
"use strict";

/* ══════════════════════════════════════════════════════════════

const EX = {

  latraise:{n:'Lateral Raise',g:'Shoulders',lvl:'Beginner',sets:2,reps:'12–15',kg:7,cues:['Lead with your elbows, not your hands.','Stop at shoulder height.','Light weight, clean reps - this one is not for ego.']},
  facepull:{n:'Face Pull',g:'Shoulders',lvl:'Beginner',sets:2,reps:'12–15',kg:15,cues:['Rope at eye height.','Pull towards your forehead, hands apart.','Pause for a beat at the back.']},
  rear:{n:'Rear Delt Fly',g:'Shoulders',lvl:'Beginner',sets:2,reps:'12–15',kg:6,cues:['Hinge forward, arms hanging.','Open out to the sides, thumbs down.','Small range, big squeeze.']},

  plank:{n:'Plank',g:'Core',lvl:'Beginner',sets:2,reps:'40 s',kg:0,cues:['Elbows under shoulders, heels pushed back.','Squeeze glutes, tuck your ribs down.','Breathe - do not hold your breath.']},

  machpress:{n:'Chest Press Machine',g:'Chest',lvl:'Beginner',sets:2,reps:'10–12',kg:35,cues:['Set the seat so the handles sit at mid-chest.','Press without shrugging your shoulders.','Control the weight back, do not let it slam.']},
  decline:{n:'Decline Bench Press',g:'Chest',lvl:'Intermediate',sets:2,reps:'8–10',kg:40,cues:['Lock your legs in, shoulders pinned back.','Lower the bar to your lower chest.','Press up over your shoulders.']},

  calf:{n:'Standing Calf Raise',g:'Legs',lvl:'Beginner',sets:2,reps:'12–15',kg:40,cues:['Balls of your feet on the edge.','Rise up as high as you can.','Stretch down slow at the bottom.']},
  hipthrust:{n:'Hip Thrust',g:'Legs',lvl:'Beginner',sets:2,reps:'8–12',kg:50,cues:['Upper back on the bench, bar over hips.','Drive your hips up, squeeze your glutes.','Chin tucked, ribs down at the top.']},

  // Shoulders
  arnoldp:{n:'Arnold Press',g:'Shoulders',lvl:'Intermediate',sets:2,reps:'8–10',kg:12,cues:['Start palms facing you at your chest.','Rotate and press overhead in one move.','Reverse it slowly on the way down.']},

  // Arms
  preacher:{n:'Preacher Curl',g:'Arms',lvl:'Beginner',sets:2,reps:'10–12',kg:15,cues:['Armpits over the top of the pad.','Curl up and squeeze at the top.','Lower fully, feel the stretch.']},
  skull:{n:'Skull Crusher',g:'Arms',lvl:'Intermediate',sets:2,reps:'10–12',kg:20,cues:['Elbows point at the ceiling, keep them fixed.','Lower the bar toward your forehead.','Straighten your arms, only the forearms move.']},

/* ══════════════════════════════════════════════════════════════
   Tiny DOM helper - h(tag, props, ...children).
   Supports style object, event handlers, and style-hover / -active.
   ══════════════════════════════════════════════════════════════ */
function h(tag, props, ...kids){
  const el = document.createElement(tag);
  props = props || {};
  let base = null, hover = null, active = null;
  for (const k in props){
    const val = props[k];
    if (val == null || val === false) continue;
    if (k === 'style'){ Object.assign(el.style, val); base = {...val}; }
    else if (k === 'hover') hover = val;
    else if (k === 'active') active = val;
    else if (k === 'html') el.innerHTML = val;
    else if (k === 'class') el.className = val;
    else if (k === 'draggable') el.draggable = val;
    else if (k.slice(0,2) === 'on' && typeof val === 'function'){
      el.addEventListener(k.slice(2).toLowerCase(), val);
    }
    else el.setAttribute(k, val);
  }
  const applyBase = () => base && Object.assign(el.style, base);
  if (hover){
    el.addEventListener('mouseenter', () => Object.assign(el.style, hover));
    el.addEventListener('mouseleave', applyBase);
  }
  if (active){
    el.addEventListener('mousedown', () => Object.assign(el.style, active));
    const up = () => Object.assign(el.style, hover || base || {});
    el.addEventListener('mouseup', up);
    el.addEventListener('mouseleave', applyBase);
  }
  for (const c of kids.flat()){
    if (c == null || c === false) continue;
    el.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return el;
}
// convenience
const svgNS = 'http://www.w3.org/2000/svg';
function svg(attrs, inner){
  const el = document.createElementNS(svgNS, 'svg');
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  el.innerHTML = inner;
  return el;
}

    active = false; dragging = false; scrubbing = false; activeSpin = null;
    if (docHandler){ document.removeEventListener('pointerdown', docHandler, true); docHandler = null; }
    const v = vals[sel];
    (commit && v !== opts.value) ? opts.onPick(v) : render();
  };
  wrap.addEventListener('pointerdown', e => {
    if (!active) open();
    dragging = true; moved = false; startY = e.clientY; startT = curT;
    try { wrap.setPointerCapture(e.pointerId); } catch(_){}
  });
  wrap.addEventListener('pointermove', e => {
    if (!dragging) return;
    if (Math.abs(e.clientY - startY) > 3) moved = true;
    paint(startT + (e.clientY - startY), false);      // 1:1 finger tracking
  });
  wrap.addEventListener('pointerup', () => {
    if (!dragging) return;
    dragging = false;
    if (moved) paint(H/2 - (sel + 0.5)*itemH, true);   // eased snap to nearest; stays open
  });
  wrap.addEventListener('pointercancel', () => { dragging = false; });
  wrap.addEventListener('contextmenu', e => e.preventDefault());
  return wrap;
}
function saveSession(){
  const w = S.w;
  Social.setPresence(false);   // workout done - clear your live status
  const day = S.week[todayIdx()];
  const hist = clone(S.hist);
  let log = S.log;
  let slapDay = null;   // set to the finished day so the strip sticker slaps in on the next render
  let splitPrompt = null;
  if (w){
    const name = w.name || day.name;
    const mins = Math.max(1, Math.round((Date.now() - w.start)/60000));
    hist[name] = (hist[name] || []).concat(mins);
    const sets = [];
    w.queue.forEach(q => q.done.forEach(x => sets.push({id:q.id, g:EX[q.id].g, kg:x.kg, reps:x.reps, secs:x.secs})));
    if (sets.length){
      const vol = sets.reduce((a,x) => a + x.kg*x.reps, 0);
      const today = ymd(new Date());
      log = [...(S.log||[]), {date:today, name, sets, vol, mins, photo:w.photo || null}];
      slapDay = today;
      // Did this session diverge from today's split? (custom, or exercises added/removed)
      const ids = []; w.queue.forEach(q => { if (q.done.length && !ids.includes(q.id)) ids.push(q.id); });
      const ti = todayIdx(), planEx = S.week[ti].ex;
      const diverged = !!w.name || ids.length !== planEx.length || ids.some(id => !planEx.includes(id)) || planEx.some(id => !ids.includes(id));
      if (diverged && ids.length) splitPrompt = {ids, di:ti};
    }
  }
  Social.setPresence(false);
  setState({hist, log, overlay:null, w:null, tab:'today', slapDay, splitPrompt});
}

        h('button', {title:'Previous month', style:{width:'38px',height:'38px',flex:'none',borderRadius:'999px',border:'1px solid var(--color-divider)',background:'transparent',cursor:'pointer',fontSize:'20px',lineHeight:'1',color:'var(--color-text)',padding:'0'}, hover:{background:'color-mix(in srgb, var(--color-text) 7%, transparent)'}, onClick:() => setState({calMonth:calOff-1})}, '‹'),
        h('div', {style:{fontSize:'12px',color:'var(--color-neutral-600)',minWidth:'92px',textAlign:'center',fontWeight:'600'}}, monthName + ' ' + y),
        h('button', {title:'Next month', style:{width:'38px',height:'38px',flex:'none',borderRadius:'999px',border:'1px solid var(--color-divider)',background:'transparent',cursor:isCurrentMonth?'default':'pointer',opacity:isCurrentMonth?'.35':'1',fontSize:'20px',lineHeight:'1',color:'var(--color-text)',padding:'0'}, hover:isCurrentMonth?null:{background:'color-mix(in srgb, var(--color-text) 7%, transparent)'}, onClick:isCurrentMonth?null:() => setState({calMonth:calOff+1})}, '›')
      )
    ),
    dowHead,
    monthGrid
  );

  // Most improved - biggest est. 1RM gain (earliest → latest session) per exercise from the log.
  const e1rm = x => Math.round(x.kg * (1 + x.reps/30));
  const byEx = {};
  (S.log||[]).forEach(r => {
    const best = {};
    r.sets.forEach(x => { const v = e1rm(x); if (best[x.id] == null || v > best[x.id]) best[x.id] = v; });
    Object.keys(best).forEach(id => (byEx[id] = byEx[id] || []).push({date:r.date, v:best[id]}));
  });
  let improved = Object.keys(byEx).map(id => {
    const a = byEx[id].slice().sort((p,q) => parseYmd(p.date) - parseYmd(q.date));
    return {id, from:a[0].v, to:a[a.length-1].v, delta:a[a.length-1].v - a[0].v, n:a.length};
  }).filter(o => o.n >= 2 && o.delta > 0);
  if (!improved.length){   // demo fallback from the seeded series
    improved = ['bench','squat','ohp','row'].map(id => { const s = SERIES[id] || SERIES.bench; return {id, from:s[0], to:s[s.length-1], delta:s[s.length-1]-s[0], n:s.length}; })
      .filter(o => o.delta > 0);
  }
  improved.sort((a,b) => b.delta - a.delta);
  const top3 = improved.slice(0,3);
  const medal = ['var(--color-accent-2-600)','var(--color-neutral-500)','var(--color-accent-400)'];
  const chartCard = h('div', {style:{background:'var(--color-surface)',borderRadius:'var(--radius-md)',padding:'18px',marginBottom:'14px',boxShadow:'var(--shadow-sm)'}},
    h('div', {style:{display:'flex',alignItems:'baseline',justifyContent:'space-between',marginBottom:'14px'}},
      h('div', {style:{fontFamily:'var(--font-heading)',fontSize:'18px'}}, 'Most improved'),
      h('div', {style:{fontSize:'12px',color:'var(--color-neutral-600)'}}, 'Est. 1RM')
    ),
    top3.length ? top3.map((o,i) => h('div', {style:{display:'flex',alignItems:'center',gap:'12px',padding:'10px 0',borderBottom:(i<top3.length-1?'1px solid var(--color-divider)':'none')}},
      h('div', {style:{width:'26px',height:'26px',flex:'none',borderRadius:'999px',background:medal[i],color:'var(--color-bg)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'12px',fontWeight:'700'}}, i+1),
      h('div', {style:{flex:'1',minWidth:'0'}},
        h('div', {style:{fontSize:'15px',fontWeight:'600',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}, EX[o.id] ? EX[o.id].n : o.id),
        h('div', {style:{fontSize:'11px',color:'var(--color-neutral-600)',marginTop:'2px'}}, o.from + ' → ' + o.to + ' kg')
      ),
      h('div', {style:{flex:'none',fontFamily:'var(--font-heading)',fontSize:'19px',color:'var(--color-accent-700)'}}, '+' + o.delta + ' kg')
    )) : h('div', {style:{fontSize:'14px',color:'var(--color-neutral-600)',padding:'6px 0'}}, 'Log a couple of sessions to see your gains.')
  );

  // muscle balance - real logged sets over the last 30 days (falls back to plan estimate if nothing logged yet)
  const setsBy = {}; GROUPS.forEach(g => setsBy[g] = 0);
  const cutoff = new Date(); cutoff.setHours(0,0,0,0); cutoff.setDate(cutoff.getDate()-30);
  let logged = 0;
  (S.log||[]).forEach(r => { if (parseYmd(r.date) >= cutoff) r.sets.forEach(s => { if (s.g in setsBy){ setsBy[s.g]++; logged++; } }); });
  if (!logged) S.week.forEach(d => d.ex.forEach(id => setsBy[EX[id].g] += EX[id].sets * 4));
  const balSub = logged ? 'Last 30 days' : 'Last month';
  const top = Math.max(1, ...Object.values(setsBy));
  const balCard = h('div', {style:{background:'var(--color-surface)',borderRadius:'var(--radius-md)',padding:'18px',boxShadow:'var(--shadow-sm)'}},
    h('div', {style:{display:'flex',alignItems:'baseline',justifyContent:'space-between',marginBottom:'14px'}},
      h('div', {style:{fontFamily:'var(--font-heading)',fontSize:'18px'}}, 'Muscle balance'),
      h('div', {style:{fontSize:'12px',color:'var(--color-neutral-600)'}}, balSub)
    ),
    GROUPS.filter(g => g !== 'Cardio').map(g => {
      const ratio = setsBy[g]/top;
      return h('div', {style:{marginBottom:'12px'}},
        h('div', {style:{display:'flex',justifyContent:'space-between',fontSize:'12px',fontWeight:'600',marginBottom:'5px'}},
          h('span', {}, g), h('span', {style:{color:'var(--color-neutral-600)'}}, setsBy[g] + ' sets')),
        h('div', {style:{height:'9px',borderRadius:'999px',background:'var(--color-neutral-300)',overflow:'hidden'}},
          h('div', {style:{height:'100%',borderRadius:'999px',background:(ratio>0.55?'var(--color-accent-2-600)':'var(--color-accent-400)'),width:Math.round(ratio*100)+'%'}}))
      );
    })
  );

  return h('div', {style:{padding:'6px 22px 152px'}},
    h('h2', {style:{fontFamily:'var(--font-heading)',fontSize:'30px',margin:'0 0 16px'}}, 'Progress'),
    consistency, chartCard, balCard
  );
}

      h('div', {style:{position:'relative',width:'230px',height:'230px',margin:'10px 0 6px'}},
        ring,
        h('div', {style:{position:'absolute',inset:'0',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}},

          h('div', {style:{fontSize:'12px',color:'var(--color-neutral-700)',marginTop:'6px'}}, 'Next: set ' + (w.queue[w.ei].done.length+1) + ' · ' + ex.n)
        )
      ),
      (() => {
        const lastSet = w.lastRef ? w.queue[w.lastRef.ei].done[w.lastRef.idx] : null;

      )
    );
  } else if (EX[w.queue[w.ei].id].cardio){
    const ex = EX[w.queue[w.ei].id];
    const running = !!w.cardioRunning, started = running || (w.cardioAccum || 0) > 0;
    const bigBtn = (label, bg, hoverBg, fn) => h('button', {style:{width:'100%',border:'none',cursor:'pointer',background:bg,color:'#fff',borderRadius:'999px',padding:'19px',fontFamily:'var(--font-heading)',fontSize:'19px'}, hover:{background:hoverBg}, onClick:fn}, label);

      h('div', {style:{fontSize:'11px',letterSpacing:'.12em',textTransform:'uppercase',color:'var(--color-neutral-600)',fontWeight:'700'}}, 'Cardio · exercise ' + (w.ei+1) + '/' + w.queue.length),
      h('h2', {style:{fontFamily:'var(--font-heading)',fontSize:'32px',margin:'6px 0 4px',letterSpacing:'-.02em'}}, ex.n),

      h('div', {style:{display:'flex',flexDirection:'column',gap:'12px'}},
        !started

              h('button', {style:{flex:'1',border:'1px solid var(--color-divider)',cursor:'pointer',background:'transparent',color:'var(--color-text)',borderRadius:'999px',padding:'17px',fontFamily:'var(--font-heading)',fontSize:'17px'}, hover:{background:'color-mix(in srgb, var(--color-text) 7%, transparent)'}, onClick:cardioBegin}, 'Continue'),

          h('button', {style:{flex:'1',border:'1px solid var(--color-divider)',cursor:'pointer',background:'transparent',color:'var(--color-text)',borderRadius:'999px',padding:'14px',fontFamily:'var(--font-heading)',fontSize:'14px'}, hover:{background:'color-mix(in srgb, var(--color-text) 7%, transparent)'}, onClick:finishWorkout}, 'Finish')
        )
      )
    );
  } else {
    const q = w.queue[w.ei];
    const ex = EX[q.id];
    const setLabel = 'Set ' + (q.done.length+1) + ' of ' + q.sets + ' · exercise ' + (w.ei+1) + '/' + w.queue.length;
    body = h('div', {style:{flex:'1',display:'flex',flexDirection:'column',padding:'26px 22px 30px'}},
      h('div', {style:{fontSize:'11px',letterSpacing:'.12em',textTransform:'uppercase',color:'var(--color-neutral-600)',fontWeight:'700'}}, setLabel),
      h('h2', {style:{fontFamily:'var(--font-heading)',fontSize:'32px',margin:'6px 0 4px',letterSpacing:'-.02em'}}, ex.n),
      h('div', {style:{fontSize:'13px',color:'var(--color-neutral-700)'}}, 'Target ' + ex.reps + ' reps · rest ' + rest() + 's'),
      (() => {
        const stepBtn = (glyph, fn) => h('button', {style:{width:'56px',height:'56px',flex:'none',borderRadius:'999px',border:'none',background:'var(--color-bg)',cursor:'pointer',fontSize:'28px',lineHeight:'1',color:'var(--color-text)',boxShadow:'var(--shadow-sm)'}, hover:{background:'color-mix(in srgb, var(--color-text) 6%, transparent)'}, onClick:fn}, glyph);
        const halfBtn = (label, fn) => h('button', {style:{flex:'1',border:'1px solid var(--color-divider)',cursor:'pointer',background:'transparent',color:'var(--color-text)',borderRadius:'999px',padding:'14px',fontFamily:'var(--font-heading)',fontSize:'14px'}, hover:{background:'color-mix(in srgb, var(--color-text) 7%, transparent)'}, onClick:fn}, label);
        return h('div', {style:{marginTop:'auto',display:'flex',flexDirection:'column',gap:'12px'}},
          // Weight - centred number + pen; tap anywhere to edit.
          h('label', {style:{background:'var(--color-surface)',borderRadius:'var(--radius-lg)',padding:'14px 20px',display:'flex',alignItems:'center',justifyContent:'center',gap:'8px',cursor:'text'}},
            h('input', {type:'text', inputmode:'decimal', value:String(w.kg), size:String(Math.max(2, String(w.kg).length)),
              onFocus:(e) => e.target.select(),
              onInput:(e) => { const v = parseFloat((e.target.value||'').replace(',', '.')); if (!isNaN(v)) S.w.kg = v; },
              style:{textAlign:'center',width:'auto',border:'none',background:'transparent',fontFamily:'var(--font-heading)',fontWeight:'700',fontSize:'46px',color:'var(--color-text)',outline:'none',padding:'0'}}),
            h('span', {style:{fontFamily:'var(--font-heading)',fontSize:'22px',color:'var(--color-neutral-700)'}}, S.unit),
            svg({viewBox:'0 0 24 24',width:'18',height:'18',style:'flex:none;color:var(--color-neutral-500)'}, '<path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 20h9"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>')
          ),
          // Reps - small +/- steps.
          h('div', {style:{background:'var(--color-surface)',borderRadius:'var(--radius-lg)',padding:'12px 18px',display:'flex',alignItems:'center',justifyContent:'center',gap:'22px'}},
            stepBtn('−', () => setState({w:{...S.w, reps:Math.max(1, S.w.reps-1)}})),
            h('div', {style:{textAlign:'center',minWidth:'64px'}},
              h('div', {style:{fontFamily:'var(--font-heading)',fontSize:'46px',lineHeight:'1'}}, w.reps),
              h('div', {style:{fontSize:'11px',letterSpacing:'.1em',textTransform:'uppercase',fontWeight:'700',color:'var(--color-neutral-600)',marginTop:'2px'}}, 'reps')
            ),
            stepBtn('+', () => setState({w:{...S.w, reps:Math.min(50, S.w.reps+1)}}))
          ),
          h('button', {style:primaryBtn({padding:'19px',fontSize:'19px'}), hover:primaryHover, active:primaryActive, onClick:logSet}, 'Log set'),
          h('div', {style:{display:'flex',gap:'10px'}}, halfBtn('Add exercise', () => setState({wPick:true})), halfBtn('Finish', finishWorkout))
        );
      })()
    );
  }

  return h('div', {style:{position:'absolute',inset:'0',background:'var(--color-bg)',display:'flex',flexDirection:'column',zIndex:'70'}},
    topBar, dots, body
  );
}
// After a finished workout that diverged from the plan - ask to save it into the split.
function applySplitUpdate(){
  const p = S.splitPrompt; if (!p) return;
  const week = clone(S.week);
  week[p.di] = {name:(EX[p.ids[0]] ? EX[p.ids[0]].g : 'Workout'), ex:p.ids};
  setState({week, splitPrompt:null});
}
function viewSplitPrompt(){
  if (!S.splitPrompt) return null;
  const p = S.splitPrompt;
  const card = h('div', {style:{width:'86%',maxWidth:'340px',background:'var(--color-bg)',borderRadius:'var(--radius-lg)',padding:'22px',boxShadow:'0 18px 50px rgba(0,0,0,.4)'},
      onClick:(ev) => ev.stopPropagation()},
    h('div', {style:{fontFamily:'var(--font-heading)',fontSize:'22px',marginBottom:'6px'}}, 'Update your split?'),
    h('div', {style:{fontSize:'14px',color:'var(--color-neutral-700)',lineHeight:'1.5',marginBottom:'18px'}}, 'This workout differs from your ' + DAY_FULL[p.di] + ' split. Save these ' + p.ids.length + ' exercises as your ' + DAY_FULL[p.di] + ' split?'),
    h('button', {style:primaryBtn({padding:'15px',fontSize:'16px'}), hover:primaryHover, onClick:applySplitUpdate}, 'Update split'),
    h('button', {style:{width:'100%',marginTop:'8px',border:'none',cursor:'pointer',background:'transparent',color:'var(--color-neutral-600)',borderRadius:'999px',padding:'12px',fontFamily:'var(--font-heading)',fontSize:'14px'}, onClick:() => setState({splitPrompt:null})}, 'Keep as is')
  );
  return h('div', {style:{position:'absolute',inset:'0',background:'rgba(32,30,29,.45)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:'95'},
      onClick:() => setState({splitPrompt:null})}, card);
}
// In-workout exercise picker - tap an exercise to append it to the live queue.
function viewWorkoutPick(){
  if (!S.wPick || !S.w) return null;
  const inQueue = new Set(S.w.queue.map(q => q.id));
  // Collapsible accordion - one group open at a time (S.wPickGroup).
  const sections = GROUPS.map(g => {
    const ids = Object.keys(EX).filter(id => EX[id].g === g);
    const col = GROUP_COLOR[g];
    const open = S.wPickGroup === g;
    const inCount = ids.filter(id => inQueue.has(id)).length;
    const header = h('button', {style:{width:'100%',display:'flex',alignItems:'center',gap:'10px',cursor:'pointer',border:'none',background:'transparent',padding:'12px 2px',color:'var(--color-text)',borderBottom:(open?'none':'1px solid var(--color-divider)')}, onClick:() => setState({wPickGroup: open ? null : g})},
      h('div', {style:{width:'4px',height:'20px',borderRadius:'999px',background:col[2]}}),
      h('div', {style:{flex:'1',textAlign:'left',fontFamily:'var(--font-heading)',fontSize:'17px'}}, g),
      inCount ? h('span', {style:{fontSize:'11px',fontWeight:'700',background:col[0],color:col[1],borderRadius:'999px',padding:'2px 9px'}}, inCount + ' added') : null,
      h('span', {style:{fontSize:'12px',color:'var(--color-neutral-600)'}}, ids.length),
      h('span', {style:{fontSize:'14px',color:'var(--color-neutral-500)',transform:(open?'rotate(90deg)':'none'),transition:'transform .12s',width:'14px',textAlign:'center'}}, '›')
    );
    const list = open ? h('div', {style:{padding:'2px 0 10px 14px'}},
      ids.map(id => h('button', {style:{width:'100%',display:'flex',alignItems:'center',gap:'11px',cursor:'pointer',border:'none',background:'transparent',padding:'10px 4px',fontFamily:'var(--font-body)',color:'var(--color-text)',borderBottom:'1px solid var(--color-divider)'}, onClick:() => addExToWorkout(id)},
        h('div', {style:{flex:'1',minWidth:'0',textAlign:'left',fontSize:'15px',fontWeight:'600',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}, EX[id].n),
        inQueue.has(id) ? h('div', {style:{fontSize:'11px',color:'var(--color-neutral-500)',fontWeight:'700'}}, 'added') : null,
        h('div', {style:{width:'30px',height:'30px',flex:'none',borderRadius:'999px',background:'var(--color-accent)',color:'var(--color-bg)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'18px',lineHeight:'1'}}, '+')
      ))
    ) : null;
    return h('div', {}, header, list);
  });
  const panel = h('div', {class:'sx', style:{width:'100%',maxHeight:'86%',overflowY:'auto',background:'var(--color-bg)',borderTopLeftRadius:'var(--radius-lg)',borderTopRightRadius:'var(--radius-lg)',padding:'14px 22px 34px'},
      onClick:(ev) => ev.stopPropagation()},
    h('div', {style:{width:'44px',height:'5px',borderRadius:'999px',background:'var(--color-neutral-400)',margin:'0 auto 16px'}}),
    h('div', {style:{fontFamily:'var(--font-heading)',fontSize:'24px',marginBottom:'6px'}}, 'Add exercise'),
    ...sections
  );
  return h('div', {style:{position:'absolute',inset:'0',background:'rgba(32,30,29,.45)',display:'flex',alignItems:'flex-end',zIndex:'90'},
      onClick:() => setState({wPick:false})}, panel);
}

  const dt = parseYmd(S.dayDetail);

  const body = sessions.length ? sessions.map(sess => {
    const setRows = sess.sets.map((s,i) => {

        h('div', {style:{flex:'none',fontFamily:'var(--font-heading)',fontSize:'17px'}}, s.secs ? fmtDur(s.secs) : (s.kg ? s.kg + ' kg' : 'Body') + ' × ' + s.reps)
      );
    });
    return h('div', {style:{marginBottom:'16px'}},
      h('div', {style:{display:'flex',alignItems:'baseline',justifyContent:'space-between',marginBottom:'6px'}},

// Read a picked image file, downscale to ≤256px, hand back a JPEG data URL.
function readPhoto(file, cb){
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 1080, scale = Math.min(1, max/Math.max(img.width, img.height));
      const w = Math.round(img.width*scale), hgt = Math.round(img.height*scale);
      const c = document.createElement('canvas'); c.width = w; c.height = hgt;
      const cx = c.getContext('2d'); cx.imageSmoothingQuality = 'high'; cx.drawImage(img, 0, 0, w, hgt);
      cb(c.toDataURL('image/jpeg', 0.85));
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
}
// Native camera/file picker fallback (no live-camera API, or on permission failure).
function pickPhotoFallback(){
  const inp = h('input', {type:'file', accept:'image/*', capture:'environment', style:{display:'none'},

  document.body.appendChild(inp); inp.click();
}
// In-app camera: live preview + flash (torch), zoom, shutter, retake/use. Lives outside render().
function openCamera(){
  const md = navigator.mediaDevices;
  if (!md || !md.getUserMedia){ pickPhotoFallback(); return; }
  let stream = null, track = null, hwZoom = false, zoom = 1, facing = 'user';   // open to selfie mode

  const video = h('video', {autoplay:'', playsinline:'', style:{position:'absolute',inset:'0',width:'100%',height:'100%',objectFit:'contain',transformOrigin:'center center'}});
  video.muted = true; video.playsInline = true;
  // Whole-frame preview - nothing cropped; captures exactly what you see.
  const frame = h('div', {style:{position:'absolute',inset:'0',overflow:'hidden',background:'#000'}}, video);
  const flashPop = h('div', {style:{position:'absolute',inset:'0',background:'#fff',opacity:'0',pointerEvents:'none',transition:'opacity .18s'}});

  const iconBtn = (glyph, extra) => h('button', {style:Object.assign({width:'44px',height:'44px',flex:'none',borderRadius:'999px',border:'none',background:'rgba(255,255,255,.16)',color:'#fff',cursor:'pointer',fontSize:'18px',display:'flex',alignItems:'center',justifyContent:'center'}, extra||{})}, glyph);
  const closeBtn = iconBtn('✕');
  const flipBtn = iconBtn('⟳');
  const flashBtn = iconBtn('⚡');
  const topBar = h('div', {style:{position:'absolute',top:'0',left:'0',right:'0',display:'flex',justifyContent:'space-between',padding:'46px 20px 0',zIndex:'2'}}, closeBtn, h('div', {style:{display:'flex',gap:'12px'}}, flipBtn, flashBtn));

  // Zoom preset buttons (0.5× / 1× / 2×).
  const zoomLevels = [0.5, 1, 2];
  const zoomBtns = zoomLevels.map(z => h('button', {style:{minWidth:'46px',height:'34px',borderRadius:'999px',border:'none',cursor:'pointer',fontFamily:'var(--font-heading)',fontSize:'13px',background:'rgba(255,255,255,.18)',color:'#fff',padding:'0 12px'}}, (z===1?'1':String(z))+'×'));
  const zoomRow = h('div', {style:{display:'flex',gap:'10px'}}, ...zoomBtns);
  const shutter = h('button', {style:{width:'74px',height:'74px',flex:'none',borderRadius:'999px',border:'5px solid #fff',background:'rgba(255,255,255,.35)',cursor:'pointer'}});
  const bottomBar = h('div', {style:{position:'absolute',bottom:'0',left:'0',right:'0',display:'flex',flexDirection:'column',alignItems:'center',gap:'18px',padding:'0 20px 42px',zIndex:'2'}}, zoomRow, shutter);

  const overlay = h('div', {style:{position:'fixed',inset:'0',background:'#000',zIndex:'300'}}, frame, flashPop, topBar, bottomBar);
  document.body.appendChild(overlay);

  const effZoom = () => Math.max(1, zoom);   // digital zoom can't go below 1
  const applyView = () => {   // combine zoom + selfie mirror on the preview
    const mx = facing === 'user' ? -1 : 1;
    if (hwZoom){ try { track.applyConstraints({advanced:[{zoom:Math.max((track.getCapabilities&&track.getCapabilities().zoom?track.getCapabilities().zoom.min:1), Math.min((track.getCapabilities&&track.getCapabilities().zoom?track.getCapabilities().zoom.max:zoom), zoom))}]}); } catch(_){} video.style.transform = 'scaleX('+mx+')'; }
    else video.style.transform = 'scale('+(mx*effZoom())+','+effZoom()+')';
    zoomBtns.forEach((b,i) => { const on = zoomLevels[i] === zoom; b.style.background = on ? '#fff' : 'rgba(255,255,255,.18)'; b.style.color = on ? '#000' : '#fff'; });
  };
  zoomBtns.forEach((b,i) => b.addEventListener('click', () => { zoom = zoomLevels[i]; applyView(); }));

  let torchOn = false;
  flashBtn.addEventListener('click', () => { if (!track) return; torchOn = !torchOn; try { track.applyConstraints({advanced:[{torch:torchOn}]}); } catch(_){} flashBtn.style.background = torchOn ? '#fff' : 'rgba(255,255,255,.16)'; flashBtn.style.color = torchOn ? '#000' : '#fff'; });

  const cleanup = () => { if (stream) stream.getTracks().forEach(t => t.stop()); if (overlay.parentNode) document.body.removeChild(overlay); };
  closeBtn.addEventListener('click', cleanup);

  const capture = () => {
    if (!video.videoWidth) return;
    const vw = video.videoWidth, vh = video.videoHeight;
    // The preview shows the whole frame (object-fit:contain), so capture the whole frame - only digital zoom crops.
    const eff = hwZoom ? 1 : effZoom();
    const sw = vw/eff, sh = vh/eff, sx = (vw-sw)/2, sy = (vh-sh)/2;
    const scale = Math.min(1, 1080/Math.max(sw, sh)), cw = Math.round(sw*scale), ch = Math.round(sh*scale);
    const c = document.createElement('canvas'); c.width = cw; c.height = ch;
    const cx = c.getContext('2d'); cx.imageSmoothingQuality = 'high';
    if (facing === 'user'){ cx.translate(cw, 0); cx.scale(-1, 1); }   // match the mirrored selfie preview
    cx.drawImage(video, sx, sy, sw, sh, 0, 0, cw, ch);
    const url = c.toDataURL('image/jpeg', 0.85);
    flashPop.style.opacity = '0.9'; setTimeout(() => { flashPop.style.opacity = '0'; }, 180);
    showPreview(url);
  };
  shutter.addEventListener('click', capture);

  function showPreview(url){
    const img = h('img', {src:url, style:{position:'absolute',inset:'0',width:'100%',height:'100%',objectFit:'contain',background:'#000',zIndex:'3'}});
    const btn = (label, primary) => h('button', {style:{flex:'1',border:primary?'none':'1px solid rgba(255,255,255,.5)',background:primary?'#fff':'transparent',color:primary?'#000':'#fff',cursor:'pointer',borderRadius:'999px',padding:'15px',fontFamily:'var(--font-heading)',fontSize:'16px'}}, label);
    const retake = btn('↺ Retake', false), use = btn('Use photo', true);
    const pbar = h('div', {style:{position:'absolute',bottom:'0',left:'0',right:'0',display:'flex',gap:'12px',padding:'0 20px 42px',zIndex:'4'}}, retake, use);
    video.style.display = 'none'; topBar.style.display = 'none'; bottomBar.style.display = 'none';
    overlay.appendChild(img); overlay.appendChild(pbar);
    retake.addEventListener('click', () => { overlay.removeChild(img); overlay.removeChild(pbar); video.style.display = ''; topBar.style.display = ''; bottomBar.style.display = ''; });
    use.addEventListener('click', () => { cleanup(); setState({w:{...S.w, photo:url}}); });
  }

  function startStream(firstTime){
    if (stream) stream.getTracks().forEach(t => t.stop());
    hwZoom = false; zoom = 1;
    md.getUserMedia({video:{facingMode:{ideal:facing}, width:{ideal:1920}, height:{ideal:1080}}, audio:false})
      .then(s => {
        stream = s; video.srcObject = s; track = s.getVideoTracks()[0];
        try { const p = video.play(); if (p && p.catch) p.catch(function(){}); } catch(_){}
        const caps = track.getCapabilities ? track.getCapabilities() : {};
        if (caps.zoom) hwZoom = true;
        flashBtn.style.display = caps.torch ? '' : 'none';   // torch only on the back camera usually
        applyView();
      })
      .catch(() => { if (firstTime){ cleanup(); pickPhotoFallback(); } });
  }
  flipBtn.addEventListener('click', () => { facing = facing === 'user' ? 'environment' : 'user'; startStream(false); });
  startStream(true);
}

// Main tab order (matches the tab bar). Drives the swipe pager.
const TAB_ORDER = ['progress','plans','today','friends','settings'];
function viewFor(tab){
  return tab === 'plans' ? viewPlans() : tab === 'friends' ? viewFriends() : tab === 'progress' ? viewProgress() : tab === 'settings' ? viewSettings() : viewToday();
}
const _scrollByTab = {};   // remember each tab's vertical scroll across re-renders

// Snapchat-style pager: three panels (prev · current · next) on a flex track offset to
// show the middle. A horizontal drag moves the track with the finger; release snaps to a
// neighbour (then commits the tab) or springs back. Vertical drags fall through to scroll.
function buildPager(){
  const ci = Math.max(0, TAB_ORDER.indexOf(S.tab));
  const prevTab = ci > 0 ? TAB_ORDER[ci-1] : null;
  const nextTab = ci < TAB_ORDER.length-1 ? TAB_ORDER[ci+1] : null;
  const panel = (tab) => h('div', {class:'sx', style:{flex:'0 0 100%',height:'100%',overflowY:'auto',overflowX:'hidden'}}, tab ? viewFor(tab) : null);
  const pPrev = panel(prevTab), pCur = panel(S.tab), pNext = panel(nextTab);
  const track = h('div', {style:{display:'flex',height:'100%',transform:'translateX(-100%)',willChange:'transform'}}, pPrev, pCur, pNext);
  const viewport = h('div', {style:{flex:'1',position:'relative',overflow:'hidden',touchAction:'pan-y'}}, track);

  // restore scroll positions
  [[prevTab,pPrev],[S.tab,pCur],[nextTab,pNext]].forEach(([t,p]) => { if (t) p.scrollTop = _scrollByTab[t] || 0; });
  pCur.addEventListener('scroll', () => { _scrollByTab[S.tab] = pCur.scrollTop; });
  phone._scroll = pCur;

  let sx = 0, sy = 0, axis = null, down = false, w = 0, committing = false;
  viewport.addEventListener('pointerdown', (e) => {
    if (committing || S.overlay || S.sheet || S.dayDetail || S.friendProfile) return;
    // let an inner horizontal scroller (friend strip, chips) keep the gesture
    for (let n = e.target; n && n !== viewport; n = n.parentElement){
      if (n !== pPrev && n !== pCur && n !== pNext && n.scrollWidth > n.clientWidth + 4 && /auto|scroll/.test(getComputedStyle(n).overflowX)) return;
    }
    down = true; axis = null; sx = e.clientX; sy = e.clientY; w = viewport.clientWidth || 1;
    track.style.transition = 'none';
  });
  viewport.addEventListener('pointermove', (e) => {
    if (!down) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (axis === null){
      if (Math.abs(dx) > 12 || Math.abs(dy) > 10){ axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y'; }   // no pointer capture - lets a tap fall through to the cell
    }
    if (axis !== 'x') return;
    e.preventDefault();
    let d = dx;
    if ((d > 0 && !prevTab) || (d < 0 && !nextTab)) d *= 0.28;   // rubber-band at the ends
    track.style.transform = 'translateX(calc(-100% + ' + d + 'px))';
  });
  const finish = (e) => {
    if (!down) return; down = false;
    if (axis !== 'x') return;
    const dx = e.clientX - sx;
    const thr = Math.min(85, w * 0.26);
    let target = null, to = '-100%';
    if (dx <= -thr && nextTab){ target = nextTab; to = '-200%'; }
    else if (dx >= thr && prevTab){ target = prevTab; to = '0%'; }
    track.style.transition = 'transform .26s cubic-bezier(.22,.61,.36,1)';
    track.style.transform = 'translateX(' + to + ')';
    if (target){ committing = true; setTimeout(() => { setState({tab:target, overlay:null}); if (target === 'friends') loadSocial(); }, 250); }
  };
  viewport.addEventListener('pointerup', finish);
  viewport.addEventListener('pointercancel', () => { if (down){ down = false; track.style.transition = 'transform .2s'; track.style.transform = 'translateX(-100%)'; } });
  return viewport;
}

/* ══════════════════════════════════════════════════════════════
   Render
   ══════════════════════════════════════════════════════════════ */
const phone = document.getElementById('phone');
function render(){
  const pager = buildPager();

  const app = h('div', {style:{height:'100%',display:'flex',flexDirection:'column',background:'var(--color-bg)',fontFamily:'var(--font-body)',color:'var(--color-text)',position:'relative',overflow:'hidden'}},
    header(),
    pager,
    tabBar(),
    S.overlay === 'builder' && viewBuilder(),
    S.overlay === 'workout' && viewWorkout(),
    S.overlay === 'workout' && viewWorkoutPick(),
    S.overlay === 'plans' && viewPlanPicker(),
    viewSheet(),
    viewDayDetail(),
    viewFriendProfile(),
    viewFriendPlan(),
    viewInviteCompose(),
    viewEditProfile(),
    viewSplitPrompt()
  );

  phone.innerHTML = '';
  phone.append(app);

  // The tapped day grows fast and "jumps" into the middle of the screen, blooming into the card.
  if (S.dayDetail && S.dayFrom){
    const sheet = document.getElementById('daySheet'), backdrop = document.getElementById('daySheetBackdrop');
    if (sheet){
      const r = sheet.getBoundingClientRect();
      const cx = r.left + r.width/2, cy = r.top + r.height/2;   // card centre (screen)
      const dx = S.dayFrom.x - cx, dy = S.dayFrom.y - cy;       // offset from centre to tapped icon
      sheet.animate([
        {transform:'translate('+dx+'px,'+dy+'px) scale(.12)', opacity:0,   offset:0},
        {transform:'translate('+(dx*0.12)+'px,'+(dy*0.12)+'px) scale(1.08)', opacity:1, offset:0.75},
        {transform:'translate(0,0) scale(1)', opacity:1, offset:1}
      ], {duration:420, easing:'cubic-bezier(.34,1.4,.5,1)'});
      if (backdrop) backdrop.animate([{opacity:0},{opacity:1}], {duration:200, easing:'ease-out'});
    }
    S.dayFrom = null;   // don't replay on later re-renders while the card stays open
  }

  // Just-finished workout: the check stamps into that day's holster (drops in big → smacks → settles).
  if (S.slapDay){
    const el = document.getElementById('strip-sticker-'+S.slapDay);
    if (el){
      el.animate([
        {transform:'translateY(-10px) scale(1.9)', opacity:0, offset:0},
        {transform:'translateY(0) scale(.84)',     opacity:1, offset:.30},   // impact squash
        {transform:'scale(1.1)', offset:.5},
        {transform:'scale(.97)', offset:.7},
        {transform:'scale(1)',   offset:1}
      ], {duration:520, easing:'cubic-bezier(.3,1.2,.5,1)'});
    }
    S.slapDay = null;
  }
}

// Rest timer / elapsed clock tick. During REST, repaint for the countdown ring; during
// active logging, only patch the elapsed-clock text so constant re-renders don't eat taps.
setInterval(() => {
  const w = S.w; if (!w || scrubbing) return;
  if (w.resting){ render(); return; }
  if (!w.done){
    const el = document.getElementById('wClock'); if (el){ const e = Math.floor((Date.now() - w.start)/1000); el.textContent = Math.floor(e/60) + ':' + String(e%60).padStart(2,'0') + ' elapsed'; }
    if (w.cardioRunning){ const cc = document.getElementById('cardioClock'); if (cc) cc.textContent = fmtDur(cardioSecs(w)); }
  }
}, 250);

applyPrefs();
render();
</script>
